/* ---------- Ranges that narrow street by street ----------
   Each player (bots and you) holds a weighted list of combos, built from the preflop action.
   After every postflop action the weights change by how strong each combo is on this board
   (percentile among all combos), whether it is a draw, and the player's type:
   bet/raise keeps strong hands + a type-sized share of bluffs (draws first); call keeps medium+ hands
   (stations keep much more); check mostly removes strong hands (passive types slow-play some). */
const ALLC=[];for(let a=1;a<52;a++)for(let b=0;b<a;b++)ALLC.push([a,b]);
const VALT={fitfold:.7,fakereg:.64,gto:.6,tag:.62,nit:.75,weak:.72,lag:.5,maniac:.35,station:.7,whale:.6,live:.65,omc:.8};
const CALLT={fitfold:.58,fakereg:.5,gto:.4,tag:.45,nit:.6,weak:.55,lag:.35,maniac:.25,station:.15,whale:.2,live:.3,omc:.6};
const SLOW={fitfold:.3,station:.6,whale:.6,live:.5,omc:.5,weak:.5};
const SENS={maniac:.4,whale:.5,station:.45,live:.7};
function combosOf(codes){if(!codes)return ALLC.map(([a,b])=>({a,b,w:1}));const set=new Set(codes);return ALLC.filter(([a,b])=>set.has(handCode(a,b))).map(([a,b])=>({a,b,w:1}))}
function heroRange(){const p=G.P[0],pos=plPos(0);switch(p.pf){case "open":return pos==="BB"?[...topShare(12)]:[...rangeFor(pos)];case "3bet":return [...topShare(6)];case "call":return [...topShare(20)];case "limp":return [...topShare(45)];default:return null}}
function boardPct(){const g=G,key=g.board.join(",");if(g.bpKey!==key){const bd=new Set(g.board),arr=[];
    for(const [a,b] of ALLC)if(!bd.has(a)&&!bd.has(b))arr.push(evalH([a,b,...g.board]));arr.sort((x,y)=>x-y);g.bpKey=key;g.bpArr=arr}
  const arr=g.bpArr;return sc=>{let lo=0,hi=arr.length;while(lo<hi){const m=(lo+hi)>>1;if(arr[m]<sc)lo=m+1;else hi=m}let up=lo;while(up<arr.length&&arr[up]===sc)up++;return (lo+(up-lo)/2)/arr.length}}
function isDraw(a,b,bd){const cs=[a,b,...bd],su=[0,0,0,0];for(const c of cs)su[c&3]++;
  for(let x=0;x<4;x++)if(su[x]===4&&((a&3)===x||(b&3)===x))return true;
  const rk=new Set(cs.map(c=>c>>2)),ha=a>>2,hb=b>>2;if(rk.has(12))rk.add(-1);
  for(let lo=-1;lo<=8;lo++){let n=0,hole=false;for(let r=lo;r<lo+5;r++)if(rk.has(r)){n++;if(r===ha||r===hb||r===-1&&(ha===12||hb===12))hole=true}if(n===4&&hole)return true}return false}
function narrow(i,act,facing,f=.66,price=.25){const g=G,p=g.P[i];if(!p.rc||!g.board.length)return;const ty=p.ty||"gto",st=SIMP[ty]||SIMP.gto,pc=boardPct();
  /* bet size: bigger bets and raises show stronger ranges and fewer bluffs; a bigger price to call
     needs a stronger hand. Maniacs, whales and stations size and call with little thought, so less so. */
  const sens=SENS[ty]??1,big=Math.max(-.4,Math.min(1.6,f-.66));
  const vt=Math.min(.97,Math.max(.2,(VALT[ty]??.6)+(facing&&act==="raise"?.1:0)+big*.12*sens));
  const ct=Math.min(.95,Math.max(.05,(CALLT[ty]??.4)+(price-.25)*.6*sens));
  const bw=Math.min(1,st.bluff*.5*streetBluff(ty,g.street)*(1-Math.max(-.5,Math.min(.6,big*.45))*sens)),before=p.rc.map(c=>c.w);
  for(const c of p.rc){if(!c.w)continue;if(g.board.includes(c.a)||g.board.includes(c.b)){c.w=0;continue}
    const q=pc(evalH([c.a,c.b,...g.board])),dr=g.street<3&&isDraw(c.a,c.b,g.board);
    if(act==="raise"||act==="bet")c.w*=q>=vt?1:dr?Math.min(1,bw*2.5):bw;
    else if(act==="call")c.w*=q>=ct?1:dr?.9:(ty==="station"||ty==="whale"?.45:.12);
    else if(act==="check")c.w*=q>=vt+.1?(SLOW[ty]??.25):1}
  if(p.rc.reduce((a,c)=>a+c.w,0)<1e-6)p.rc.forEach((c,k)=>c.w=before[k])}
function sampleRc(rc,used){let tot=0;for(const c of rc)if(c.w&&!used.has(c.a)&&!used.has(c.b))tot+=c.w;if(tot<=0)return null;
  let r=Math.random()*tot;for(const c of rc){if(!c.w||used.has(c.a)||used.has(c.b))continue;r-=c.w;if(r<=0)return [c.a,c.b]}return null}

/* ---------- Play coach: grade every hero decision (0-100) against these opponents ----------
   Preflop unopened: same logic as the Preflop drill (players behind decide); the GTO play scores 75.
   Otherwise: equity vs the bots' likely ranges (from what they did preflop), against the price,
   adjusted for who is betting (a nit's bet is strong, a maniac's is not). */
/* how much of a type's bluffing happens on each street. Population tendency (Galfond 2023):
   low-stakes players under-bluff the river, so all but LAGs and maniacs bluff it much less. */
function streetBluff(ty,st){const s=SIMP[ty]||SIMP.gto;if(s.bluffS)return s.bluffS[st-1]??1;return st===1?1:st===2?.6:["lag","maniac"].includes(ty)?.6:.25}
const BETADJ={fitfold:.08,fakereg:.03,nit:.08,weak:.08,omc:.1,station:.1,whale:.05,live:.06,gto:0,tag:.02,lag:-.05,maniac:-.1};
function botRange(i){const p=G.P[i],s=SIMP[p.ty]||SIMP.gto,pos=plPos(i),L=LIMPERS[p.ty];
  switch(p.pf){case "open":return [...(L?L.raise:pos==="BB"?topShare(s.tb*1.5):openRange(p.ty,pos))];
    case "3bet":return p.ty==="omc"?["AA","KK"]:[...topShare(Math.max(2,s.tb))];
    case "limp":return L?[...L.limp,...L.raise]:[...topShare(Math.min(60,s.cont*1.5))];
    case "call":return [...topShare(s.cont)];default:return null}}
function pairFrom(r,used){for(let k=0;k<30;k++){const c=r[rnd(r.length)],a=R.indexOf(c[0]),b=R.indexOf(c[1]),s1=rnd(4);let s2=rnd(4);
    if(c.length===3&&c[2]==="s")s2=s1;else while(s2===s1)s2=rnd(4);const x=a*4+s1,y=b*4+s2;if(!used.has(x)&&!used.has(y))return [x,y]}return null}
function randPair(used){let x,y;do x=rnd(52);while(used.has(x));do y=rnd(52);while(used.has(y)||y===x);return [x,y]}
function rangeEq(h,board,opps,it){let w=0;for(let k=0;k<it;k++){const used=new Set([...h,...board]),hs=[];
    for(const i of opps){const P=G.P[i],r=P.rc?null:P.rng||(i?botRange(i):heroRange());const c=(P.rc&&sampleRc(P.rc,used))||(r&&r.length&&pairFrom(r,used))||randPair(used);hs.push(c);used.add(c[0]);used.add(c[1])}
    const rest=[];for(let c=0;c<52;c++)if(!used.has(c))rest.push(c);const nd=5-board.length;
    for(let j=0;j<nd;j++){const m=j+rnd(rest.length-j);[rest[j],rest[m]]=[rest[m],rest[j]]}
    const bd=board.concat(rest.slice(0,nd)),me=evalH(h.concat(bd));let lose=false,tie=0;
    for(const o of hs){const sc=evalH(o.concat(bd));if(sc>me){lose=true;break}if(sc===me)tie++}if(!lose)w+=1/(tie+1)}return w/it}
function gradeHero(kind,cache,to){cache=cache||{};const ctx={value:false,callers:false};const g=G,h=g.P[0],A=t().plA,call=r2(Math.min(g.curBet-h.bet,h.stack)),pt=potOf(),pos=plPos(0);
  const act=kind==="allin"||kind==="bet"?"raise":kind,live=[];g.P.forEach((p,i)=>{if(i&&!p.folded)live.push(i)});
  const code=handCode(h.cards[0],h.cards[1]),r=SRANK[code]??100,why=[];let sc;
  const pctS=x=>Math.round(x*100)+(lang==="fr"?" %":"%");
  if(g.street===0&&g.raiseN===0&&pos!=="BB"){
    const behind=live.filter(i=>!g.P[i].acted).map(i=>g.P[i].ty);ctx.callers=behind.some(x=>["station","whale","live"].includes(x));const plan=heroPlan(pos,behind.length?behind:["gto"]),gp=heroPlan(pos,"gto");

    if(r<=(big?s.tb:lvl>1?s.cont/2:s.cont)||(pos==="BB"&&lvl===1&&call<=2&&r<=s.cont*1.6))return doAct(i,"call");
    return doAct(i,"fold")}
  const others=[];g.P.forEach((q,j)=>{if(j!==i&&!q.folded)others.push(j)});const opp=others.length,eq=rangeEq(p.cards,g.board,others.slice(0,3),160);
  if(call>0){const odds=call/(pt+call);
    if(eq>=s.rz&&Math.random()<.75)return doAct(i,"raise",r2(g.curBet*2.8));
    const rr=["bet","raise"].includes(p.lastK)&&["tag","fakereg"].includes(p.ty)?1.3:1;
    if(eq>=Math.min(.95,odds*s.loose*rr+.03))return doAct(i,"call");
    if(p.ty==="maniac"&&Math.random()<.12)return doAct(i,"raise",r2(g.curBet*2.8));
    return doAct(i,"fold")}
  if(eq>=s.val||Math.random()<s.bluff*streetBluff(p.ty,g.street)*(opp>1?.5:1))return doAct(i,"bet",Math.max(1,r2(pt*s.size)));
  return doAct(i,"check")}
function heroOpts(){const g=G,p=g.P[0],call=r2(Math.min(g.curBet-p.bet,p.stack)),maxTo=r2(p.bet+p.stack),pt=potOf(),o=[];
  if(call>0)o.push(["fold"]);o.push(call>0?["call"]:["check"]);
  const limpers=g.P.filter((q,j)=>j&&!q.folded&&q.bet===1&&plPos(j)!=="BB").length;
  const sizes=g.street===0?(g.raiseN===0?[2.5,3,4].map(x=>x+limpers):[3,4].map(x=>r2(g.curBet*x))):g.curBet===0?[.33,.66,1].map(f=>r2(Math.max(1,pt*f))):[2.5,3.5].map(x=>r2(g.curBet*x));
  const kind=g.curBet===0?"bet":"raise";
  for(const to of sizes)if(to>=g.curBet+g.minR&&to<maxTo&&!o.some(x=>x[1]===to))o.push([kind,to]);
  if(maxTo>g.curBet&&call<p.stack)o.push(["allin",maxTo]);return o}

/* Read the table: hidden opponents, observed stats, your read per seat, then reveal and score. */
const FAMILY={fitfold:"lp",fakereg:"ta",nit:"tp",weak:"tp",omc:"tp",tag:"ta",gto:"ta",station:"lp",whale:"lp",live:"lp",lag:"la",maniac:"la"};
function paintRead(){const g=G,el=$("pl-read");if(!g||!g.read){el.hidden=true;return}el.hidden=false;const pc=(a,b)=>b?Math.round(a/b*100)+"%":"–";
  const bots=g.P.filter((p,i)=>i),done=bots.filter(p=>p.idOK).length,wrong=bots.reduce((a,p)=>a+p.tries.length,0),all=done===bots.length;
  const rows=g.P.map((p,i)=>{if(!i)return "";const h=p.hs,af=h.calls?(h.agg/h.calls).toFixed(1):h.agg?"∞":"–";
    const near=x=>!STY[x]&&!styles()&&FAMILY[x]===FAMILY[p.ty];const tried=p.tries.length?`<div class="tried">${p.tries.map(x=>`<span class="${near(x)?"mid":"ko"}">${near(x)?"≈":"✘"} ${STY[x]?STYS[x]:PSHORT[x]}</span>`).join(" ")}</div>`:"";
    const right=p.idOK?`<span class="res ok">✔ ${PNAME[p.face]} · ${tyName(p.ty)}${p.tries.length?` <small>(${t().plTries(p.tries.length)})</small>`:""}</span>`
      :`<span class="gbox"><select data-guess="${i}"><option value="">${t().plGuess}…</option>${OPTS().filter(k=>!p.tries.includes(k)).map(k=>`<option value="${k}">${optName(k)}</option>`).join("")}</select><button class="pill" data-try="${i}">${t().plTry}</button></span>`;
    return `<div class="pl-rrow" style="--sc:${SEATC[(i-1)%8]}"><b class="stag">${seatTag(i)}</b><span class="stat">${t().plStats(h.n,pc(h.vp,h.n),pc(h.pfr,h.n),af)}${tried}</span>${right}</div>`}).join("");
  const score=Math.max(0,100-wrong*10);
  el.innerHTML=`<h3>${ic("read")} ${t().plRead} · ${done}/${bots.length}</h3><p class="muted">${all?"":t().plReadHint}</p>${rows}${all?`<div class="pl-readdone"><b>${t().plReadDone(g.done,wrong,score)}</b></div>`:`<p class="muted">${t().plReadClose}</p>`}<div class="pl-rbtns"><button class="pill" data-newread>${t().plNewTable}</button></div>`}
$("pl-read").addEventListener("click",e=>{const b=e.target.closest("[data-try]");
  if(b){const i=+b.dataset.try,p=G.P[i],v=$("pl-read").querySelector(`[data-guess="${i}"]`).value;if(!v)return;if(v===p.ty||STY[v]&&famOf(p.ty)===v)p.idOK=true;else p.tries.push(v);paintPlay();return}
  if(e.target.closest("[data-newread]"))newGame()});

function paintPlay(){const g=G;if(!g)return;paintRead();const seats={};
  g.P.forEach((p,i)=>{const pos=plPos(i);
    if(i===0){seats[pos]={bet:p.bet,win:p.win>0};return}
    const st=p.folded?"fold":["raise","bet","allin"].includes(p.lastK)?"raise":p.lastK==="call"?"limp":"wait";
    seats[pos]={st,bet:p.bet,av:pers()?p.face:null,anon:seatHidden(i)?t().plSeat(i):null,ai:SEATI[(i-1)%8],ac:g.read?SEATC[(i-1)%8]:null,guess:"",cards:p.show?p.cards:null,act:p.last||(!g.over&&i===g.toAct?"…":""),stack:p.stack,win:p.win>0,turn:!g.over&&i===g.toAct,
      sub:`${p.last?p.last+" · ":""}${bb(p.stack)}`}});
  const h=g.P[0],hp=plPos(0);
  paintRing("pl-table",{bottom:hp,bottomCards:h.cards,bottomLabel:`${t().you} · ${lbl(hp)}`,bottomSub:bb(h.stack)+(h.win>0?` · +${bb(h.win)}`:""),seats,
    center:boardCenter(t().plStreets[g.over&&g.P.some(p=>p.show)?4:Math.min(g.street,3)],g.board,`${t().pot} ${bb(potOf())}`)});
  const net=r2(h.stack-g.inv);
  $("pl-sess").innerHTML=`<span class="lbl">${t().plHands}: <b>${g.done}</b></span><span class="lbl">${t().plNet}: <b class="${net>=0?"pos":"neg"}">${net>0?"+":""}${bb(net)}</b></span>${g.done?`<span class="lbl">${(net/g.done*100).toFixed(1)} bb/100</span>`:""}${g.grades&&g.grades.length?`<span class="lbl">${t().plScore}: <b>${Math.round(g.grades.reduce((a,b)=>a+b,0)/g.grades.length)}/100</b></span>`:""}<button class="pill" data-plnew>${t().plNew}</button>`;
  let c="";
  if(g.over)c=`<p class="plres">${g.result}</p><button class="next" data-plnext>${t().plNext}</button>${g.autoAt?`<p class="muted pl-autonote">${t().plAutoNote}</p>`:""}`;
  else if(g.toAct===0){const call=r2(Math.min(g.curBet-h.bet,h.stack));
    c=`<p class="q">${call>0?`${t().plToCall}: <b>${bb(call)}</b> · `:""}${t().pot}: <b>${bb(potOf())}</b></p><div class="answers pl-ans">${heroOpts().map(([k,to])=>`<button class="ans" data-pa="${k}" data-to="${to||0}">${k==="fold"?t().fold:k==="check"?t().check:k==="call"?t().plAct.call+" "+bb(call):t().plAct[k]+" "+bb(to)}</button>`).join("")}</div>`;
    if($("pl-coach").checked){const ob=[];g.P.forEach((q,j)=>{if(j&&!q.folded)ob.push(j)});const e=Math.round(rangeEq(h.cards,g.board,ob.slice(0,3),500)*100),need=call>0?Math.round(call/(potOf()+call)*100):0;c+=`<p class="muted">${t().plEq(e,need)}</p>`}}
  else c=`<p class="q muted">${t().plWait(plName(g.toAct))}</p>`;
  $("pl-ctrl").innerHTML=c;$("pl-log").innerHTML=g.log.map(x=>`<li>${x}</li>`).join("")}
$("pl-ctrl").addEventListener("click",e=>{const b=e.target.closest("[data-pa]");if(b)return heroAct(b.dataset.pa,+b.dataset.to);if(e.target.closest("[data-plnext]"))newHand()});
$("pl-sess").addEventListener("click",e=>{if(e.target.closest("[data-plnew]"))newGame()});
$("pl-coach").addEventListener("change",()=>paintPlay());
$("pl-auto").checked=plAuto;$("pl-auto").addEventListener("change",e=>{plAuto=e.target.checked;try{localStorage.setItem(PAKEY,plAuto?"1":"0")}catch(err){}
  const g=G;if(!g)return;if(g.over){clearTimeout(g.timer);g.autoAt=0;if(plAuto){g.autoAt=Date.now()+1500;g.timer=setTimeout(newHand,1500)}paintPlay()}});
$("pl-grade").addEventListener("click",e=>{const r=e.target.closest("[data-retry]");if(r){const k=r.dataset.retry,to=+r.dataset.to;undoPlay();heroAct(k,to);return}if(e.target.closest("[data-undo]"))undoPlay()});

/* ---------- navigation ---------- */
const VIEWS=["play","preflop","defense","equity","potodds","showdown","villains","stats"];
const INIT={preflop:newPreflop,defense:newDefense,equity:newEquity,potodds:newPotOdds,showdown:newShowdown};
const STATE={preflop:()=>pf,defense:()=>df,equity:()=>eq,potodds:()=>po,showdown:()=>sd};
const ANS={preflop:i=>answerPreflop(i),defense:i=>answer("defense",df,i,paintDefense),equity:i=>answer("equity",eq,i,paintEquity),potodds:i=>answer("potodds",po,i,paintPotOdds),showdown:i=>answer("showdown",sd,i,paintShowdown)};
let current="preflop";const started={};
function paintMode(){
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.mode===mode));
  $("pf-prof").hidden=$("df-prof").hidden=!pers();paintTblEd("pf-tbl");paintTblEd("df-tbl");
  document.querySelector('.tab[data-view="villains"]').hidden=!pers();
}
$("mode").addEventListener("click",e=>{const b=e.target.closest("[data-mode]");if(!b||b.dataset.mode===mode)return;
  mode=b.dataset.mode;try{localStorage.setItem(MKEY,mode)}catch(err){}paintMode();
  if(!pers()&&current==="villains")location.hash="preflop";
  for(const k of ["preflop","defense"])if(started[k])INIT[k]();if(G)newGame();applyLang()});
function show(v){
  if(v==="equite")v="equity";
  if(v==="villains"&&!pers())v="preflop";
  if(!VIEWS.includes(v))v="preflop";current=v;resetArmed=false;
  for(const x of VIEWS)$("v-"+x).hidden=x!==v;
  document.querySelectorAll(".tab").forEach(tb=>tb.setAttribute("aria-selected",tb.dataset.view===v));
  if(INIT[v]&&!started[v]){started[v]=true;INIT[v]()}
  if(v==="stats")paintStats();
  if(v==="villains")paintVillains();
  if(v==="play"){paintPlProf();if(!G)newGame();else paintPlay()}
}
document.querySelector(".tabs").addEventListener("click",e=>{const tb=e.target.closest(".tab");if(!tb)return;
  if(location.hash!=="#"+tb.dataset.view)location.hash=tb.dataset.view;else show(tb.dataset.view)});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("click",e=>{if(e.target.closest("[data-next]")&&INIT[current]){INIT[current]();window.scrollTo({top:0,behavior:"smooth"})}});
document.addEventListener("keydown",e=>{
  if(!$("settings").hidden){if(e.key==="Escape")closeSettings();return}
  if(!$("limp-pop").hidden){if(e.key==="Escape"||e.key==="Enter"){e.preventDefault();closeLimpPop()}return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="SELECT")return;const k=e.key.toLowerCase();
  if(!INIT[current])return;const st=STATE[current]();if(!st)return;
  if((k==="enter"||k===" ")&&st.chosen!=null){e.preventDefault();INIT[current]();return}
  if(current==="preflop"){const m={f:0,c:1,r:2,"1":0,"2":1,"3":2}[k];if(m!=null)ANS.preflop(m);return}
  if(current==="defense"){const ks=dfLabels().keys.map(x=>x.toLowerCase());let m=ks.indexOf(k);if(m<0&&k==="r")m=ks.indexOf("3");if(m<0){const d=parseInt(k,10);if(d>=1&&d<=ks.length)m=d-1}if(m>=0)ANS.defense(m);return}
  const n=parseInt(k,10);const max=$(({equity:"eq",potodds:"po",showdown:"sd"})[current]+"-ans").children.length;
  if(n>=1&&n<=max)ANS[current](n-1);
});
paintStreak();paintSize();paintMode();applyLang();show(location.hash.slice(1)||"preflop");
})();

<script>
if ("serviceWorker" in navigator) {
  // Vérifie les mises à jour à chaque visite (et toutes les 30 min), sans passer par le cache HTTP,
  // puis recharge une fois quand la nouvelle version prend le relais.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadController && !reloaded) { reloaded = true; location.reload(); } });
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
    .then(r => { r.update(); setInterval(() => r.update(), 30 * 60 * 1000); }).catch(() => {}));
}
</script>
