<style>
/* Layout: one narrow app-like column; the felt "table" holds the cards, answers are big thumb buttons. */
:root{

  --f-display:"Big Shoulders Display","Arial Narrow",Impact,"PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic","Malgun Gothic","Noto Sans CJK SC","Leelawadee UI","Noto Sans Thai","Nirmala UI","Noto Sans Devanagari",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans","Microsoft YaHei","Yu Gothic","Malgun Gothic","Noto Sans CJK SC","Leelawadee UI","Noto Sans Thai","Nirmala UI","Noto Sans Devanagari",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}

  --felt:#1b4d3a; --felt-2:#143c2d; --on-felt:#e3efe8; --brass:#d8a748; --brass-soft:#3a2f17;
  --good:#52c486; --good-soft:#173826; --bad:#e46d6d; --bad-soft:#3d1d1d;
  --card-bg:#f1f2ee; --card-edge:#9aa39d; --in:#2f8a66; --in-ink:#ffffff; --out:#1d2924; --out-ink:#5f7068; --tb:#c8653c; --rail:#3d281a; --rail-edge:#24170e; --back-a:#9a3030; --back-b:#7a2323;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --ink:#e5ece8; --muted:#93a39a; --line:#2a3832;
  --felt:#1b4d3a; --felt-2:#143c2d; --on-felt:#e3efe8; --brass:#d8a748; --brass-soft:#3a2f17;
  --good:#52c486; --good-soft:#173826; --bad:#e46d6d; --bad-soft:#3d1d1d;
  --card-bg:#f1f2ee; --card-edge:#9aa39d; --in:#2f8a66; --in-ink:#ffffff; --out:#1d2924; --out-ink:#5f7068; --tb:#c8653c; --rail:#3d281a; --rail-edge:#24170e; --back-a:#9a3030; --back-b:#7a2323;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}

.right{display:flex;align-items:center;gap:12px}

.gear{background:none;border:1.5px solid var(--line);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:420px;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:8px}
.field small.muted{color:var(--muted);font-size:13px}
.field .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--in);flex:none}
.check b{display:block;font-weight:600}
.check small{display:block;color:var(--muted);font-size:13px;line-height:1.4}

.sheet .next{align-self:flex-end}

.field .lang{align-self:flex-start} .field .lang button{padding:6px 14px;font-size:13px}

.table{background:radial-gradient(120% 90% at 50% 30%,var(--felt) 0%,var(--felt-2) 100%);color:var(--on-felt);
  border-radius:22px;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.ctx{font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.8}

.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px}

.seats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}

.card{width:46px;height:64px;border-radius:7px;background:var(--card-bg);border:1px solid var(--card-edge);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.card b{font-family:var(--f-display);font-size:26px;font-weight:800}
.card i{font-style:normal;font-size:20px;margin-top:2px}
.card.s{color:var(--s)} .card.h{color:var(--h)} .card.d{color:var(--d)} .card.c{color:var(--c)}

.ring{position:relative;height:340px;width:100%;max-width:560px;margin:0 auto}

.pseat.hero .pbox{border-color:var(--brass);background:var(--brass-soft)}
.pseat.raise .pbox,.pseat.limp .pbox{border-color:var(--tb)} .pseat.limp .pbox small{color:var(--tb);font-weight:700} .pseat.raise .pbox small{color:var(--tb);font-weight:700}
.mini{display:flex;gap:2px;min-height:24px;align-items:flex-end}
.hc{display:flex;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

.cseat{position:relative}

@media (max-width:420px){.hc.big{top:16px}.hc.big .hcb{width:21px;height:29px}.hc.big .hcb+.hcb{margin-left:-8px}.ring.n9 .hc.big{top:0;left:70%}.ring.n9 .hc.big .hcb{width:16px;height:22px}.ring.n9 .hc.big .hcb+.hcb{margin-left:-6px}.hc .hcb{width:16px;height:22px}}
.mini span:not(.card){width:17px;height:24px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);border:1.5px solid var(--card-bg)}
.bet{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:12px;color:var(--on-felt);display:flex;align-items:center;gap:4px;z-index:1;font-variant-numeric:tabular-nums}

@media (max-width:420px){.ring{height:310px}.ring.n9{height:380px}.card.md{width:30px;height:42px}.card.md b{font-size:18px}.pbox{min-width:48px;padding:2px 6px}.potv{font-size:22px}}

  font-variant-numeric:tabular-nums;transition:transform .08s,border-color .15s}

.av.anon{border-radius:50%;object-fit:cover;background:var(--sc);border:3px solid #22182a;box-shadow:0 0 0 3px var(--sc,#9aa0ad),0 3px 10px rgba(0,0,0,.45)!important;box-sizing:border-box;flex:none}

@media (max-width:420px){.av.anon{font-size:32px}.ring.n9 .av.anon{font-size:22px}}

.ctype.anon{background:transparent;border:1px dashed currentColor;color:var(--muted);text-shadow:none}
.pl-read{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:10px 0}

.pl-opt.me{box-shadow:0 0 0 2px var(--ink);font-weight:700}

.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.villains{display:flex;flex-direction:column;gap:12px}

.intro{background:var(--brass-soft);border-color:var(--brass)}

<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">Hold'em <span>Drill</span></div><div class="tagline" data-t="tagline"></div></div>
    <div class="right">
      <div class="streak" aria-live="polite"><span data-t="streak"></span> <b id="streak">0</b> · <span data-t="best"></span> <b id="best">0</b></div>
      <button class="gear" id="open-settings" aria-haspopup="dialog" data-tl="settings"><img class="ic gear-ic" src="ui/ic-gear.webp" alt="" aria-hidden="true"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="preflop" data-t="tabPreflop"></button>
    <button class="tab" role="tab" data-view="defense" data-t="tabDefense"></button>
    <button class="tab" role="tab" data-view="villains" data-t="tabVillains"></button>
    <button class="tab" role="tab" data-view="equity" data-t="tabEquity"></button>
    <button class="tab" role="tab" data-view="potodds" data-t="tabPotodds"></button>
    <button class="tab" role="tab" data-view="showdown" data-t="tabShowdown"></button>
    <button class="tab" role="tab" data-view="play" data-t="tabPlay"></button>
    <button class="tab" role="tab" data-view="stats" data-t="tabStats"></button>
  </nav>

  <section id="v-preflop" hidden>
    <div class="bar" id="pf-prof"></div>
    <div class="tbl-ed" id="pf-tbl" hidden></div>
    <div class="ring" id="pf-table"></div>
    <p class="q" data-t="pfQ"></p>
    <div class="answers" id="pf-ans"></div>
    <div class="fb" id="pf-fb" hidden></div>
    <details class="study" id="study">
      <summary data-t="study"></summary>
      <div class="bar" id="study-pos"></div>
      <div class="grid-wrap"><div class="grid" id="study-grid"></div></div>
      <p class="pct" id="study-pct"></p>
    </details>
  </section>

  <section id="v-defense" hidden>
    <div class="bar" id="df-prof"></div>
    <div class="tbl-ed" id="df-tbl" hidden></div>
    <div class="ring" id="df-table"></div>
    <p class="q" id="df-q"></p>
    <div class="answers" id="df-ans"></div>
    <div class="fb" id="df-fb" hidden></div>
    <details class="study">
      <summary data-t="dfStudy"></summary>
      <div class="bar" id="dstudy-spot"></div>
      <div class="grid-wrap"><div class="grid" id="dstudy-grid"></div></div>
      <p class="pct" id="dstudy-pct"></p>
      <p class="pct" data-t="epNote"></p>
    </details>
  </section>

  <section id="v-equity" hidden>
    <div class="ring" id="eq-table"></div>
    <p class="q" data-t="eqQ"></p>
    <div class="answers" id="eq-ans"></div>
    <div class="fb" id="eq-fb" hidden></div>
    <details class="study how"><summary data-t="eqHowTitle"></summary><div class="body" data-th="eqHow"></div></details>
  </section>

  <section id="v-potodds" hidden>
    <div class="table" id="po-table"></div>
    <p class="q" id="po-q"></p>
    <div class="answers" id="po-ans"></div>
    <div class="fb" id="po-fb" hidden></div>
    <details class="study how"><summary data-t="poHowTitle"></summary><div class="body" data-th="poHow"></div></details>
  </section>

  <section id="v-showdown" hidden>
    <div class="ring" id="sd-table"></div>
    <p class="q" data-t="sdQ"></p>
    <div class="answers" id="sd-ans"></div>
    <div class="fb" id="sd-fb" hidden></div>
  </section>

  <section id="v-play" hidden>
    <p class="muted" data-t="plIntro"></p>
    <div class="bar" id="pl-prof"></div>
    <div class="tbl-ed" id="pl-tbl" hidden></div>
    <div class="bar pl-sess" id="pl-sess"></div>
    <div class="ring" id="pl-table"></div>
    <div id="pl-ctrl"></div>
    <div class="pl-grade" id="pl-grade" hidden></div>

    <div class="pl-speed" id="pl-speed"></div>
    <div class="pl-read" id="pl-read" hidden></div>

  <section id="v-villains" hidden>

      <div class="grid-wrap"><div class="grid" id="vp-grid"></div></div>

  <section id="v-stats" hidden>
    <div class="stats" id="stats"></div>
  </section>

  <div class="modal" id="settings" hidden>

          <option value="cs">Čeština</option>
          <option value="hu">Magyar</option>
          <option value="ro">Română</option>
          <option value="sv">Svenska</option>
          <option value="da">Dansk</option>
          <option value="nb">Norsk</option>
          <option value="fi">Suomi</option>
          <option value="tr">Türkçe</option>
          <option value="el">Ελληνικά</option>

          <option value="uk">Українська</option>

      <label class="check" id="set-terms-row">
        <input type="checkbox" id="set-terms">
        <span><b data-t="setTerms"></b><small id="set-terms-hint"></small></span>

      <div class="field">
        <span class="t" data-t="modeLbl"></span>
        <div class="lang" id="mode" role="group" aria-label="Mode"><button data-mode="classic" data-t="modeClassic"></button><button data-mode="styles" data-t="modeStyles"></button><button data-mode="pers" data-t="modePers"></button></div>
        <small class="muted" data-t="modeHint"></small>
      </div>
      <div class="field">
        <span class="t" data-t="setTable"></span>
        <div class="lang" id="size" role="group" aria-label="Table size"><button data-size="6" aria-pressed="true">6-max</button><button data-size="9" aria-pressed="false">9-max</button></div>
      </div>
      <button class="next" id="close-settings" data-t="done"></button>

</div>

  ptag:{gto:"Mixes every frequency. Feels nothing.",tag:"Twelve tables, one plan: value.",nit:"Last bluffed in 1998.",weak:"Wants to win. Hates to lose.",lag:"Bets because you won't.",maniac:"Raises first. Looks at her cards later.",station:"Never folds a pair. Or anything else.",whale:"Here for fun, paying for the whole table.",live:"Limps, calls, tells great stories.",omc:"Raises once a night. Believe him.",fitfold:"Missed the flop? Gone.",fakereg:"Perfect preflop. Lost after the flop."},
  pdesc:{gto:"Plays GTO perfectly: a balanced strategy that can't be exploited. Bluffing them or tricking them doesn't work. Their weakness is elsewhere: GTO never adapts. They play the same way against an OMC as against a maniac, and leave on the table the money that reads would win.",
    tag:"Tight-aggressive regular. Plays fewer hands than GTO, mostly pairs, broadways and suited aces, and raises when they play.",
    nit:"Very tight, also called a rock. Opens big pairs and big cards (about TT+ and AQ+ from early seats), rarely bluffs and 3-bets only QQ+ and AK.",
    weak:"Also called a TAGfish. Plays as tight as a nit preflop, almost never bluffs, c-bets less than half the time and gives up easily on the turn and river.",
    lag:"Loose-aggressive. Opens close to 30% of hands overall, adds many suited hands and 3-bets often.",
    maniac:"Hyper-aggressive. Plays about half of their hands and raises most of them, often bigger than standard, then keeps betting.",
    station:"Loose-passive online recreational player. Limps a wide range (pairs, suited hands, broadways, connectors), raises only strong hands, then calls down too much.",
    whale:"The loosest recreational player. Plays more than half of their hands, almost always by limping or calling, and rarely folds once they have any piece of the board.",
    live:"The typical live $1/$2 player. Plays about a third of their hands but raises only about 6%, limps the rest, raises big when they do raise and almost never 3-bets.",
    omc:"Old Man Coffee: the older live regular nursing a coffee. Very tight and passive: limps pairs and big cards hoping for a set, raises only QQ+ and AK, never bluffs. When he stays in the pot, he has it.",fitfold:"Plays plenty of hands preflop (VPIP about 25, PFR 5–15), mostly by calling, then plays fit-or-fold: continues only when the flop hits, rarely bluffs and rarely reaches showdown. When they bet or raise, they usually have it.",fakereg:"Looks like a solid regular (stats around 25/20) because they follow a memorized preflop chart, but postflop they are lost: they c-bet the flop, then give up, fold too much on the turn and rarely bluff the river."},
  pexp:{gto:"Learn GTO: it is the baseline that keeps you safe against them, so play close to it when they are in the pot. Then beat them where they don't look: exploit the other players better than they do. GTO stacks off KK preflop by default; you can fold KK to an OMC's shove because he only does it with AA or KK, and you hold one of the kings.",
    tag:"Stay close to the classical charts, respect their 3-bets and avoid fancy bluffs.",
    nit:"Steal their blinds, 3-bet their opens light because they fold too much, and fold to their 3-bets and big postflop bets without a strong hand.",
    weak:"Steal their blinds relentlessly, 3-bet them light and bluff the turn and river when they check. Believe them when they raise.",
    lag:"Call wider against their opens (KTs, QJs, 77), keep your 3-bets mostly for value, don't 4-bet bluff and trap with strong hands.",
    maniac:"Tighten your own opens a little, 4-bet wider for value (JJ, AQo, KQs), call down with top pair good kicker and never slowplay.",
    station:"Isolate their limps with a raise to about 4bb plus 1bb per limper (5bb from the blinds), bet thin for value, bet bigger with strong hands and never bluff.",
    whale:"Isolate even wider, value-bet every street with any decent made hand and size up. Bluffing is lighting money on fire.",
    live:"Raise bigger than online (about 4bb plus 1bb per limper), isolate limpers with strong hands, and treat their rare raises and 3-bets as very strong.",
    omc:"Steal his blinds and attack his limps when he folds too much. When he raises, bets big or calls twice, fold everything but a very strong hand: he is almost never bluffing. When he re-raises or shoves preflop it is AA or KK: folding KK there is the exploit, even though GTO would stack off.",fitfold:"C-bet and barrel wide: they fold everything that missed. Isolate their limps. Fold to their raises unless you are strong, and don't pay off their rare big bets.",fakereg:"Don't respect their preflop stats. Float their flop c-bets and bet the turn when they check, keep barreling when they show weakness, and skip thin value bets: they fold too much."},

  eqHowTitle:"Comment estimer ton équité",
  eqHow:`<p><b>1. Compte tes outs.</b> Les outs sont les cartes qui te font passer devant : un tirage couleur en a 9, une quinte ouverte 8, un gutshot 4, deux overcards environ 6.</p>
<p><b>2. Règle du 4 et du 2.</b> Au flop, avec deux cartes à venir : outs × 4. Au turn, avec une carte à venir : outs × 2. Avec plus de 8 outs au flop, retire les outs en trop : 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Si tu es devant,</b> compte les outs de ton adversaire et prends le reste : il a 9 outs au flop ≈ 36 %, donc tu as environ 64 %.</p>
<p><b>4. Préflop, retiens les duels classiques</b> (part du favori) :</p>
<ul><li>Grosse paire contre petite paire (KK contre QQ) : ≈ 80 %</li><li>Paire contre deux cartes plus basses (QQ contre JT) : ≈ 80 %</li><li>Paire contre une overcard (QQ contre AJ) : ≈ 70 %</li><li>Main dominée, carte commune (AK contre AQ) : ≈ 70 %</li><li>Deux overcards contre deux cartes basses (AK contre 98) : ≈ 60 %</li><li>Paire contre deux overcards (QQ contre AK) : ≈ 55 %, un pile ou face</li></ul>`,
  ruleOf:n=>`Règle du ${n}`,
  youOuts:(o,rule,est)=>`Tu es derrière avec <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Tu es devant ; ton adversaire a <b>${o} outs</b>. ${rule} ≈ ${est} % pour lui, donc environ <b>${mine} %</b> pour toi.`,

  poHowTitle:"Comment faire le calcul",
  poHow:`<p><b>1. Équité requise = ton call ÷ le pot final.</b> Le pot final, c'est le pot, plus la mise, plus ton call : mise ÷ (pot + 2 × mise).</p>
<p class="ex">Exemple : le pot fait 100 et ton adversaire mise 50. Tu paies 50 pour gagner un pot final de 200 : 50 ÷ 200 = 25 %.</p>
<p><b>2. Retiens les raccourcis selon la taille de mise :</b></p>
<ul><li>1/3 pot → 20 %</li><li>1/2 pot → 25 %</li><li>2/3 pot → 28,6 %</li><li>3/4 pot → 30 %</li><li>Pot → 33 %</li><li>2× pot → 40 %</li></ul>
<p><b>3. Compare avec ton équité.</b> Au turn, outs × 2. Paie si ton équité est plus haute, fold si elle est plus basse. Les cotes implicites (ce que tu peux gagner aux streets suivantes) peuvent justifier un call un peu juste.</p>`,

  pexp:{gto:"Apprends le GTO : c'est la base qui te protège contre lui, alors joue près de cette base quand il est dans le coup. Ensuite, bats-le là où il ne regarde pas : exploite les autres joueurs mieux que lui. Le GTO met KK à tapis préflop par défaut ; toi, tu peux folder KK face au tapis d'un OMC, parce qu'il ne le fait qu'avec AA ou KK, et que tu tiens un des rois.",

es:{eqHowTitle:"Cómo estimar tu equity",
  eqHow:`<p><b>1. Cuenta tus outs.</b> Los outs son las cartas que te ponen por delante: un proyecto de color tiene 9, un proyecto de escalera abierta 8, un gutshot 4, dos overcards unos 6.</p>
<p><b>2. Regla del 4 y del 2.</b> En el flop, con dos cartas por salir: outs × 4. En el turn, con una carta por salir: outs × 2. Con más de 8 outs en el flop, resta los outs que sobran: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Si vas por delante,</b> cuenta los outs de tu rival y quédate con el resto: tiene 9 outs en el flop ≈ 36 %, así que tú tienes cerca del 64 %.</p>
<p><b>4. En preflop, apréndete los enfrentamientos clásicos</b> (la parte del favorito):</p>
<ul><li>Pareja mayor contra pareja menor (KK contra QQ): ≈ 80 %</li><li>Pareja contra dos cartas más bajas (QQ contra JT): ≈ 80 %</li><li>Pareja contra una overcard (QQ contra AJ): ≈ 70 %</li><li>Mano dominada, carta compartida (AK contra AQ): ≈ 70 %</li><li>Dos overcards contra dos cartas más bajas (AK contra 98): ≈ 60 %</li><li>Pareja contra dos overcards (QQ contra AK): ≈ 55 %, un cara o cruz</li></ul>`,
  ruleOf:n=>`Regla del ${n}`,
  youOuts:(o,rule,est)=>`Vas por detrás con <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Vas por delante; tu rival tiene <b>${o} outs</b>. ${rule} ≈ ${est} % para él, así que cerca del <b>${mine} %</b> para ti.`,
  mu:{pp:"pareja mayor contra pareja menor",pover2:"pareja contra dos overcards",pover1:"pareja contra una overcard",punder:"pareja contra dos cartas más bajas",dom:"mano dominada (carta compartida)",over:"dos overcards contra dos cartas más bajas",mixed:"una carta alta cada uno"},
  muLine:(name,fav)=>`Enfrentamiento: ${name}. El favorito suele tener cerca del <b>${fav} %</b>.`,
  poHowTitle:"Cómo hacer el cálculo",
  poHow:`<p><b>1. Equity necesaria = tu call ÷ el bote final.</b> El bote final es el bote, más la apuesta, más tu call: apuesta ÷ (bote + 2 × apuesta).</p>
<p class="ex">Ejemplo: el bote es de 100 y tu rival apuesta 50. Pagas 50 para ganar un bote final de 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Apréndete los atajos según el tamaño de la apuesta:</b></p>
<ul><li>1/3 del bote → 20 %</li><li>1/2 del bote → 25 %</li><li>2/3 del bote → 28,6 %</li><li>3/4 del bote → 30 %</li><li>Bote → 33 %</li><li>2× bote → 40 %</li></ul>
<p><b>3. Compara con tu equity.</b> En el turn, outs × 2. Paga si tu equity es mayor, haz fold si es menor. Las odds implícitas (lo que puedes ganar en las calles siguientes) pueden justificar un call un poco justo.</p>`,

pt:{eqHowTitle:"Como estimar sua equity",
  eqHow:`<p><b>1. Conte seus outs.</b> Outs são as cartas que te colocam na frente: um flush draw tem 9, um open-ended 8, um gutshot 4, duas overcards cerca de 6.</p>
<p><b>2. Regra do 4 e do 2.</b> No flop, com duas cartas por vir: outs × 4. No turn, com uma carta por vir: outs × 2. Com mais de 8 outs no flop, tire os outs a mais: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Se você está na frente,</b> conte os outs do adversário e fique com o resto: ele tem 9 outs no flop ≈ 36 %, então você tem cerca de 64 %.</p>
<p><b>4. No preflop, decore os confrontos clássicos</b> (a parte do favorito):</p>
<ul><li>Par maior contra par menor (KK contra QQ): ≈ 80 %</li><li>Par contra duas cartas menores (QQ contra JT): ≈ 80 %</li><li>Par contra uma overcard (QQ contra AJ): ≈ 70 %</li><li>Mão dominada, carta em comum (AK contra AQ): ≈ 70 %</li><li>Duas overcards contra duas cartas menores (AK contra 98): ≈ 60 %</li><li>Par contra duas overcards (QQ contra AK): ≈ 55 %, um cara ou coroa</li></ul>`,
  ruleOf:n=>`Regra do ${n}`,
  youOuts:(o,rule,est)=>`Você está atrás com <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Você está na frente; o adversário tem <b>${o} outs</b>. ${rule} ≈ ${est} % para ele, então cerca de <b>${mine} %</b> para você.`,
  mu:{pp:"par maior contra par menor",pover2:"par contra duas overcards",pover1:"par contra uma overcard",punder:"par contra duas cartas menores",dom:"mão dominada (carta em comum)",over:"duas overcards contra duas cartas menores",mixed:"uma carta alta para cada um"},
  muLine:(name,fav)=>`Confronto: ${name}. O favorito costuma ter cerca de <b>${fav} %</b>.`,
  poHowTitle:"Como fazer a conta",
  poHow:`<p><b>1. Equity necessária = seu call ÷ o pote final.</b> O pote final é o pote, mais a aposta, mais o seu call: aposta ÷ (pote + 2 × aposta).</p>
<p class="ex">Exemplo: o pote é 100 e o adversário aposta 50. Você paga 50 para ganhar um pote final de 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Decore os atalhos por tamanho de aposta:</b></p>
<ul><li>1/3 pote → 20 %</li><li>1/2 pote → 25 %</li><li>2/3 pote → 28,6 %</li><li>3/4 pote → 30 %</li><li>Pote → 33 %</li><li>2× pote → 40 %</li></ul>
<p><b>3. Compare com sua equity.</b> No turn, outs × 2. Pague se sua equity for maior, dê fold se for menor. As odds implícitas (o que você pode ganhar nas próximas streets) podem justificar um call um pouco abaixo.</p>`,

de:{eqHowTitle:"So schätzt du deine Equity",
  eqHow:`<p><b>1. Zähl deine Outs.</b> Outs sind die Karten, die dich nach vorn bringen: Ein Flush Draw hat 9, ein Open-Ended Straight Draw 8, ein Gutshot 4, zwei Overcards etwa 6.</p>
<p><b>2. 4er- und 2er-Regel.</b> Am Flop, mit zwei kommenden Karten: Outs × 4. Am Turn, mit einer kommenden Karte: Outs × 2. Mit mehr als 8 Outs am Flop ziehst du die überzähligen Outs ab: 15 Outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Wenn du vorn liegst,</b> zähl die Outs deines Gegners und nimm den Rest: Er hat 9 Outs am Flop ≈ 36 %, also hast du etwa 64 %.</p>
<p><b>4. Preflop: Lern die klassischen Matchups</b> (Anteil des Favoriten):</p>
<ul><li>Höheres Paar gegen niedrigeres Paar (KK gegen QQ): ≈ 80 %</li><li>Paar gegen zwei niedrigere Karten (QQ gegen JT): ≈ 80 %</li><li>Paar gegen eine Overcard (QQ gegen AJ): ≈ 70 %</li><li>Dominierte Hand, gemeinsame Karte (AK gegen AQ): ≈ 70 %</li><li>Zwei Overcards gegen zwei niedrigere Karten (AK gegen 98): ≈ 60 %</li><li>Paar gegen zwei Overcards (QQ gegen AK): ≈ 55 %, ein Coinflip</li></ul>`,
  ruleOf:n=>`${n}er-Regel`,

  poHow:`<p><b>1. Nötige Equity = dein Call ÷ der Endpot.</b> Der Endpot ist der Pot plus die Bet plus dein Call: Bet ÷ (Pot + 2 × Bet).</p>
<p class="ex">Beispiel: Der Pot ist 100 und dein Gegner bettet 50. Du callst 50, um einen Endpot von 200 zu gewinnen: 50 ÷ 200 = 25 %.</p>
<p><b>2. Lern die Abkürzungen nach Bet-Größe:</b></p>
<ul><li>1/3 Pot → 20 %</li><li>1/2 Pot → 25 %</li><li>2/3 Pot → 28,6 %</li><li>3/4 Pot → 30 %</li><li>Pot → 33 %</li><li>2× Pot → 40 %</li></ul>
<p><b>3. Vergleich mit deiner Equity.</b> Am Turn: Outs × 2. Calle, wenn deine Equity höher ist, folde, wenn sie niedriger ist. Implied Odds (Geld, das du auf späteren Streets gewinnen kannst) können einen knapp zu teuren Call rechtfertigen.</p>`,

it:{eqHowTitle:"Come stimare la tua equity",
  eqHow:`<p><b>1. Conta i tuoi outs.</b> Gli outs sono le carte che ti mettono avanti: un progetto di colore ne ha 9, un progetto di scala bilaterale 8, un gutshot 4, due overcard circa 6.</p>
<p><b>2. Regola del 4 e del 2.</b> Al flop, con due carte da scoprire: outs × 4. Al turn, con una carta da scoprire: outs × 2. Con più di 8 outs al flop, togli gli outs in eccesso: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Se sei avanti,</b> conta gli outs del tuo avversario e prendi il resto: ha 9 outs al flop ≈ 36 %, quindi tu hai circa il 64 %.</p>
<p><b>4. Al preflop, impara gli scontri classici</b> (la quota del favorito):</p>
<ul><li>Coppia più alta contro coppia più bassa (KK contro QQ): ≈ 80 %</li><li>Coppia contro due carte più basse (QQ contro JT): ≈ 80 %</li><li>Coppia contro una overcard (QQ contro AJ): ≈ 70 %</li><li>Mano dominata, carta in comune (AK contro AQ): ≈ 70 %</li><li>Due overcard contro due carte più basse (AK contro 98): ≈ 60 %</li><li>Coppia contro due overcard (QQ contro AK): ≈ 55 %, un testa o croce</li></ul>`,
  ruleOf:n=>`Regola del ${n}`,
  youOuts:(o,rule,est)=>`Sei dietro con <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Sei avanti; il tuo avversario ha <b>${o} outs</b>. ${rule} ≈ ${est} % per lui, quindi circa il <b>${mine} %</b> per te.`,
  mu:{pp:"coppia più alta contro coppia più bassa",pover2:"coppia contro due overcard",pover1:"coppia contro una overcard",punder:"coppia contro due carte più basse",dom:"mano dominata (carta in comune)",over:"due overcard contro due carte più basse",mixed:"una carta alta a testa"},
  muLine:(name,fav)=>`Scontro: ${name}. Il favorito ha di solito circa il <b>${fav} %</b>.`,
  poHowTitle:"Come fare il calcolo",
  poHow:`<p><b>1. Equity richiesta = il tuo call ÷ il piatto finale.</b> Il piatto finale è il piatto, più la puntata, più il tuo call: puntata ÷ (piatto + 2 × puntata).</p>
<p class="ex">Esempio: il piatto è 100 e il tuo avversario punta 50. Chiami 50 per vincere un piatto finale di 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Impara le scorciatoie in base alla size della puntata:</b></p>
<ul><li>1/3 pot → 20 %</li><li>1/2 pot → 25 %</li><li>2/3 pot → 28,6 %</li><li>3/4 pot → 30 %</li><li>Pot → 33 %</li><li>2× pot → 40 %</li></ul>
<p><b>3. Confronta con la tua equity.</b> Al turn, outs × 2. Chiama se la tua equity è più alta, folda se è più bassa. Le implied odds (quello che puoi vincere nelle street successive) possono giustificare un call un po' al limite.</p>`,

ru:{eqHowTitle:"Как оценить эквити",
  eqHow:`<p><b>1. Посчитай ауты.</b> Ауты — это карты, которые выводят тебя вперёд: у флеш-дро их 9, у двустороннего стрит-дро 8, у гатшота 4, у двух оверкарт около 6.</p>
<p><b>2. Правило 4 и 2.</b> На флопе, когда впереди две карты: ауты × 4. На тёрне, когда осталась одна карта: ауты × 2. Если на флопе больше 8 аутов, вычти лишние: 15 аутов ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Если ты впереди,</b> посчитай ауты оппонента и возьми остаток: у него 9 аутов на флопе ≈ 36 %, значит у тебя около 64 %.</p>
<p><b>4. На префлопе запомни классические расклады</b> (доля фаворита):</p>
<ul><li>Старшая пара против младшей (KK против QQ): ≈ 80 %</li><li>Пара против двух младших карт (QQ против JT): ≈ 80 %</li><li>Пара против одной оверкарты (QQ против AJ): ≈ 70 %</li><li>Доминируемая рука, общая карта (AK против AQ): ≈ 70 %</li><li>Две оверкарты против двух младших карт (AK против 98): ≈ 60 %</li><li>Пара против двух оверкарт (QQ против AK): ≈ 55 %, почти монетка</li></ul>`,
  ruleOf:n=>`Правило ${n}`,
  youOuts:(o,rule,est)=>`Ты позади, у тебя <b>${o} аутов</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Ты впереди; у оппонента <b>${o} аутов</b>. ${rule} ≈ ${est} % у него, значит у тебя около <b>${mine} %</b>.`,
  mu:{pp:"старшая пара против младшей",pover2:"пара против двух оверкарт",pover1:"пара против одной оверкарты",punder:"пара против двух младших карт",dom:"доминируемая рука (общая карта)",over:"две оверкарты против двух младших карт",mixed:"у каждого по одной старшей карте"},
  muLine:(name,fav)=>`Расклад: ${name}. У фаворита обычно около <b>${fav} %</b>.`,
  poHowTitle:"Как посчитать",
  poHow:`<p><b>1. Нужное эквити = твой колл ÷ итоговый банк.</b> Итоговый банк — это банк, плюс ставка, плюс твой колл: ставка ÷ (банк + 2 × ставка).</p>
<p class="ex">Пример: в банке 100, оппонент ставит 50. Ты коллируешь 50, чтобы выиграть итоговый банк 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Запомни ориентиры по размеру ставки:</b></p>
<ul><li>1/3 банка → 20 %</li><li>1/2 банка → 25 %</li><li>2/3 банка → 28,6 %</li><li>3/4 банка → 30 %</li><li>Банк → 33 %</li><li>2× банк → 40 %</li></ul>
<p><b>3. Сравни со своим эквити.</b> На тёрне ауты × 2. Коллируй, если твоё эквити выше, фолди, если ниже. Имплайд-оддсы (деньги, которые можно выиграть на следующих улицах) могут оправдать колл, которому чуть-чуть не хватает.</p>`,

zh:{eqHowTitle:"如何估算胜率",
  eqHow:`<p><b>1. 数你的补牌。</b>补牌就是能让你反超的牌：同花听牌有 9 张，两头顺子听牌 8 张，卡顺听牌 4 张，两张高张约 6 张。</p>
<p><b>2. 4 和 2 法则。</b>翻牌时还有两张牌要发：补牌 × 4。转牌时还有一张牌要发：补牌 × 2。翻牌时补牌超过 8 张，要减去多出的张数：15 张补牌 ≈ 15 × 4 − 7 = 53 %。</p>
<p><b>3. 如果你领先，</b>数对手的补牌，剩下的就是你的：对手翻牌时有 9 张补牌 ≈ 36 %，所以你约有 64 %。</p>
<p><b>4. 翻牌前，记住经典对决</b>（优势方的胜率）：</p>
<ul><li>大对子对小对子（KK 对 QQ）：≈ 80 %</li><li>对子对两张小牌（QQ 对 JT）：≈ 80 %</li><li>对子对一张高张（QQ 对 AJ）：≈ 70 %</li><li>被压制的牌，有一张共同牌（AK 对 AQ）：≈ 70 %</li><li>两张高张对两张小牌（AK 对 98）：≈ 60 %</li><li>对子对两张高张（QQ 对 AK）：≈ 55 %，接近掷硬币</li></ul>`,
  ruleOf:n=>`${n} 法则`,
  youOuts:(o,rule,est)=>`你落后，有 <b>${o} 张补牌</b>。${rule} ≈ <b>${est} %</b>。`,
  vilOuts:(o,rule,est,mine)=>`你领先；对手有 <b>${o} 张补牌</b>。${rule} ≈ 对手 ${est} %，所以你约有 <b>${mine} %</b>。`,
  mu:{pp:"大对子对小对子",pover2:"对子对两张高张",pover1:"对子对一张高张",punder:"对子对两张小牌",dom:"被压制的牌（有共同牌）",over:"两张高张对两张小牌",mixed:"双方各有一张大牌"},
  muLine:(name,fav)=>`对决：${name}。优势方通常约有 <b>${fav} %</b>。`,
  poHowTitle:"如何计算",
  poHow:`<p><b>1. 所需胜率 = 你的跟注 ÷ 最终底池。</b>最终底池 = 底池 + 下注 + 你的跟注，即：下注 ÷（底池 + 2 × 下注）。</p>
<p class="ex">例子：底池 100，对手下注 50。你跟注 50，争夺 200 的最终底池：50 ÷ 200 = 25 %。</p>
<p><b>2. 按下注大小记住速算值：</b></p>
<ul><li>1/3 底池 → 20 %</li><li>1/2 底池 → 25 %</li><li>2/3 底池 → 28.6 %</li><li>3/4 底池 → 30 %</li><li>满池 → 33 %</li><li>2× 底池 → 40 %</li></ul>
<p><b>3. 与你的胜率比较。</b>转牌时，补牌 × 2。胜率更高就跟注，更低就弃牌。隐含赔率（之后几条街还能赢到的钱）可以让略差一点的跟注变得合理。</p>`,

  pdesc:{gto:"均衡的、求解器风格的常客。按经典图表打牌，没有明显漏洞可攻击。",

ja:{eqHowTitle:"エクイティの見積もり方",
  eqHow:`<p><b>1. アウツを数える。</b>アウツとは、あなたを逆転させるカードです。フラッシュドローは9枚、オープンエンド・ストレートドローは8枚、ガットショットは4枚、オーバーカード2枚は約6枚です。</p>
<p><b>2. 4と2のルール。</b>フロップでは残り2枚：アウツ × 4。ターンでは残り1枚：アウツ × 2。フロップでアウツが8枚を超えるときは、超えた分を引きます：15アウツ ≈ 15 × 4 − 7 = 53 %。</p>
<p><b>3. リードしているときは、</b>相手のアウツを数えて残りを取ります：相手がフロップで9アウツ ≈ 36 % なら、あなたは約64 %です。</p>
<p><b>4. プリフロップは定番の対決を覚える</b>（有利な側の取り分）：</p>
<ul><li>大きいペア vs 小さいペア（KK vs QQ）：≈ 80 %</li><li>ペア vs 下のカード2枚（QQ vs JT）：≈ 80 %</li><li>ペア vs オーバーカード1枚（QQ vs AJ）：≈ 70 %</li><li>ドミネートされたハンド、共通カードあり（AK vs AQ）：≈ 70 %</li><li>オーバーカード2枚 vs 下のカード2枚（AK vs 98）：≈ 60 %</li><li>ペア vs オーバーカード2枚（QQ vs AK）：≈ 55 %、ほぼコインフリップ</li></ul>`,
  ruleOf:n=>`${n}のルール`,
  youOuts:(o,rule,est)=>`あなたは劣勢で、<b>${o}アウツ</b>あります。${rule} ≈ <b>${est} %</b>。`,
  vilOuts:(o,rule,est,mine)=>`あなたがリードしています。相手は<b>${o}アウツ</b>。${rule} ≈ 相手 ${est} %、つまりあなたは約<b>${mine} %</b>。`,
  mu:{pp:"大きいペア vs 小さいペア",pover2:"ペア vs オーバーカード2枚",pover1:"ペア vs オーバーカード1枚",punder:"ペア vs 下のカード2枚",dom:"ドミネートされたハンド（共通カード）",over:"オーバーカード2枚 vs 下のカード2枚",mixed:"互いに高いカードが1枚ずつ"},
  muLine:(name,fav)=>`対決：${name}。有利な側は通常約<b>${fav} %</b>です。`,
  poHowTitle:"計算のしかた",
  poHow:`<p><b>1. 必要エクイティ = あなたのコール ÷ 最終ポット。</b>最終ポットは、ポット＋ベット＋あなたのコールです：ベット ÷（ポット + 2 × ベット）。</p>
<p class="ex">例：ポットが100で、相手が50をベット。50をコールして最終ポット200を狙います：50 ÷ 200 = 25 %。</p>
<p><b>2. ベットサイズ別の目安を覚える：</b></p>
<ul><li>1/3ポット → 20 %</li><li>1/2ポット → 25 %</li><li>2/3ポット → 28.6 %</li><li>3/4ポット → 30 %</li><li>ポット → 33 %</li><li>2×ポット → 40 %</li></ul>
<p><b>3. 自分のエクイティと比べる。</b>ターンではアウツ × 2。エクイティが上ならコール、下ならフォールド。インプライドオッズ（後のストリートで勝てるお金）があれば、少し足りないコールも正当化できます。</p>`,

ko:{eqHowTitle:"에퀴티 추정하는 법",
  eqHow:`<p><b>1. 아웃츠를 세세요.</b> 아웃츠는 나를 앞서게 해 주는 카드예요. 플러시 드로우는 9장, 양방향 스트레이트 드로우는 8장, 거셧은 4장, 투 오버카드는 약 6장이에요.</p>
<p><b>2. 4와 2의 법칙.</b> 플랍에서 두 장이 남았을 때: 아웃츠 × 4. 턴에서 한 장이 남았을 때: 아웃츠 × 2. 플랍에서 아웃츠가 8장보다 많으면 초과분을 빼세요: 아웃츠 15장 ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. 내가 앞서 있다면,</b> 상대의 아웃츠를 세고 나머지를 가져가세요: 상대가 플랍에서 아웃츠 9장 ≈ 36 %면, 나는 약 64 %예요.</p>
<p><b>4. 프리플랍에서는 대표적인 매치업을 외우세요</b> (우세한 쪽의 몫):</p>
<ul><li>높은 페어 vs 낮은 페어 (KK vs QQ): ≈ 80 %</li><li>페어 vs 낮은 카드 두 장 (QQ vs JT): ≈ 80 %</li><li>페어 vs 오버카드 한 장 (QQ vs AJ): ≈ 70 %</li><li>도미네이트된 핸드, 공유 카드 (AK vs AQ): ≈ 70 %</li><li>투 오버카드 vs 낮은 카드 두 장 (AK vs 98): ≈ 60 %</li><li>페어 vs 투 오버카드 (QQ vs AK): ≈ 55 %, 거의 코인 플립</li></ul>`,
  ruleOf:n=>`${n}의 법칙`,
  youOuts:(o,rule,est)=>`뒤처져 있고 <b>아웃츠 ${o}장</b>이 있어요. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`앞서 있어요. 상대는 <b>아웃츠 ${o}장</b>. ${rule} ≈ 상대 ${est} %, 그래서 나는 약 <b>${mine} %</b>.`,
  mu:{pp:"높은 페어 vs 낮은 페어",pover2:"페어 vs 투 오버카드",pover1:"페어 vs 오버카드 한 장",punder:"페어 vs 낮은 카드 두 장",dom:"도미네이트된 핸드 (공유 카드)",over:"투 오버카드 vs 낮은 카드 두 장",mixed:"서로 높은 카드 한 장씩"},

  poHowTitle:"계산하는 법",
  poHow:`<p><b>1. 필요 에퀴티 = 내 콜 ÷ 최종 팟.</b> 최종 팟은 팟 + 베팅 + 내 콜이에요: 베팅 ÷ (팟 + 2 × 베팅).</p>
<p class="ex">예: 팟이 100이고 상대가 50을 베팅해요. 50을 콜해서 최종 팟 200을 노려요: 50 ÷ 200 = 25 %.</p>
<p><b>2. 베팅 크기별 단축값을 외우세요:</b></p>
<ul><li>1/3 팟 → 20 %</li><li>1/2 팟 → 25 %</li><li>2/3 팟 → 28.6 %</li><li>3/4 팟 → 30 %</li><li>팟 → 33 %</li><li>2× 팟 → 40 %</li></ul>
<p><b>3. 내 에퀴티와 비교하세요.</b> 턴에서는 아웃츠 × 2. 에퀴티가 더 높으면 콜, 더 낮으면 폴드하세요. 임플라이드 오즈(이후 스트리트에서 더 딸 수 있는 돈)가 있으면 살짝 모자란 콜도 정당화될 수 있어요.</p>`,

pl:{eqHowTitle:"Jak oszacować equity",
  eqHow:`<p><b>1. Policz swoje outy.</b> Outy to karty, które dają ci prowadzenie: flush draw ma ich 9, open-ended straight draw 8, gutshot 4, dwie overcardy około 6.</p>
<p><b>2. Reguła 4 i 2.</b> Na flopie, gdy zostały dwie karty: outy × 4. Na turnie, gdy została jedna karta: outy × 2. Gdy masz na flopie więcej niż 8 outów, odejmij nadwyżkę: 15 outów ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Jeśli prowadzisz,</b> policz outy przeciwnika i weź resztę: ma 9 outów na flopie ≈ 36%, więc ty masz około 64%.</p>
<p><b>4. Preflop zapamiętaj klasyczne starcia</b> (udział faworyta):</p>

  poHowTitle:"Jak to policzyć",
  poHow:`<p><b>1. Wymagane equity = twój call ÷ końcowa pula.</b> Końcowa pula to pula plus bet plus twój call: bet ÷ (pula + 2 × bet).</p>
<p class="ex">Przykład: w puli jest 100, a przeciwnik betuje 50. Płacisz 50, żeby wygrać końcową pulę 200: 50 ÷ 200 = 25%.</p>
<p><b>2. Zapamiętaj skróty według wielkości betu:</b></p>
<ul><li>1/3 puli → 20%</li><li>1/2 puli → 25%</li><li>2/3 puli → 28,6%</li><li>3/4 puli → 30%</li><li>Pula → 33%</li><li>2× pula → 40%</li></ul>
<p><b>3. Porównaj ze swoim equity.</b> Na turnie outy × 2. Calluj, gdy twoje equity jest wyższe, folduj, gdy jest niższe. Implied odds (pieniądze, które możesz wygrać na kolejnych ulicach) mogą uzasadnić call, któremu trochę brakuje.</p>`,

cs:{eqHowTitle:"Jak odhadnout equitu",
  eqHow:`<p><b>1. Spočítej si outy.</b> Outy jsou karty, které tě dostanou do vedení: flush draw jich má 9, oboustranný straight draw 8, gutshot 4, dvě overcardy zhruba 6.</p>
<p><b>2. Pravidlo 4 a 2.</b> Na flopu, kdy přijdou ještě dvě karty: outy × 4. Na turnu, kdy přijde ještě jedna karta: outy × 2. Když máš na flopu víc než 8 outů, odečti outy navíc: 15 outů ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Když vedeš,</b> spočítej outy soupeře a vezmi zbytek: má na flopu 9 outů ≈ 36 %, takže ty máš zhruba 64 %.</p>
<p><b>4. Preflop si zapamatuj klasické souboje</b> (podíl favorita):</p>
<ul><li>Vyšší pár proti nižšímu páru (KK proti QQ): ≈ 80 %</li><li>Pár proti dvěma nižším kartám (QQ proti JT): ≈ 80 %</li><li>Pár proti jedné overcardě (QQ proti AJ): ≈ 70 %</li><li>Dominovaná kombinace, společná karta (AK proti AQ): ≈ 70 %</li><li>Dvě overcardy proti dvěma nižším kartám (AK proti 98): ≈ 60 %</li><li>Pár proti dvěma overcardám (QQ proti AK): ≈ 55 %, hod mincí</li></ul>`,
  ruleOf:n=>`Pravidlo ${n}`,
  youOuts:(o,rule,est)=>`Prohráváš a máš <b>${o} outů</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Vedeš; soupeř má <b>${o} outů</b>. ${rule} ≈ ${est} % pro něj, takže zhruba <b>${mine} %</b> pro tebe.`,
  mu:{pp:"vyšší pár proti nižšímu páru",pover2:"pár proti dvěma overcardám",pover1:"pár proti jedné overcardě",punder:"pár proti dvěma nižším kartám",dom:"dominovaná kombinace (společná karta)",over:"dvě overcardy proti dvěma nižším kartám",mixed:"každý jednu vysokou kartu"},
  muLine:(name,fav)=>`Souboj: ${name}. Favorit má obvykle zhruba <b>${fav} %</b>.`,
  poHowTitle:"Jak to spočítat",
  poHow:`<p><b>1. Potřebná equita = tvůj call ÷ konečný pot.</b> Konečný pot je pot plus bet plus tvůj call: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Příklad: v potu je 100 a soupeř betuje 50. Platíš 50, abys vyhrál konečný pot 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Zapamatuj si zkratky podle velikosti betu:</b></p>
<ul><li>1/3 potu → 20 %</li><li>1/2 potu → 25 %</li><li>2/3 potu → 28,6 %</li><li>3/4 potu → 30 %</li><li>Pot → 33 %</li><li>2× pot → 40 %</li></ul>
<p><b>3. Porovnej to se svou equitou.</b> Na turnu outy × 2. Calluj, když je tvoje equita vyšší, folduj, když je nižší. Implied odds (peníze, které můžeš vyhrát v dalších kolech) můžou ospravedlnit call, který těsně nevychází.</p>`,

hu:{eqHowTitle:"Hogyan becsüld meg az equityt",
  eqHow:`<p><b>1. Számold meg az outjaidat.</b> Az outok azok a lapok, amelyekkel előnybe kerülsz: egy flöss húzónak 9 van, egy nyitott sorhúzónak 8, egy gutshotnak 4, két overcardnak kb. 6.</p>
<p><b>2. A négyes és kettes szabály.</b> Flopon, ha két lap van hátra: outok × 4. Turnön, ha egy lap van hátra: outok × 2. Ha flopon 8-nál több outod van, vond le a többletet: 15 out ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Ha előnyben vagy,</b> számold meg az ellenfeled outjait, és vedd a maradékot: ha flopon 9 outja van ≈ 36%, akkor neked kb. 64% jut.</p>
<p><b>4. Preflop tanuld meg a klasszikus párharcokat</b> (a favorit része):</p>
<ul><li>Nagyobb pár kontra kisebb pár (KK kontra QQ): ≈ 80%</li><li>Pár kontra két alacsonyabb lap (QQ kontra JT): ≈ 80%</li><li>Pár kontra egy overcard (QQ kontra AJ): ≈ 70%</li><li>Dominált kéz, közös lap (AK kontra AQ): ≈ 70%</li><li>Két overcard kontra két alacsonyabb lap (AK kontra 98): ≈ 60%</li><li>Pár kontra két overcard (QQ kontra AK): ≈ 55%, fej vagy írás</li></ul>`,
  ruleOf:n=>`Szabály: outok × ${n}`,
  youOuts:(o,rule,est)=>`Hátrányban vagy, outok száma: <b>${o}</b>. ${rule} ≈ <b>${est}%</b>.`,
  vilOuts:(o,rule,est,mine)=>`Előnyben vagy; az ellenfeled outjainak száma: <b>${o}</b>. ${rule} ≈ ${est}% neki, így neked kb. <b>${mine}%</b> jut.`,
  mu:{pp:"nagyobb pár kontra kisebb pár",pover2:"pár kontra két overcard",pover1:"pár kontra egy overcard",punder:"pár kontra két alacsonyabb lap",dom:"dominált kéz (közös lap)",over:"két overcard kontra két alacsonyabb lap",mixed:"fejenként egy magas lap"},
  muLine:(name,fav)=>`Párharc: ${name}. A favorit esélye általában kb. <b>${fav}%</b>.`,
  poHowTitle:"Hogyan számolj",
  poHow:`<p><b>1. Szükséges equity = a callod ÷ a végső pot.</b> A végső pot a pot, plusz a bet, plusz a callod: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Példa: a pot 100, és az ellenfeled 50-et betel. 50-et callolsz, hogy egy 200-as végső potot nyerj: 50 ÷ 200 = 25%.</p>
<p><b>2. Tanuld meg a gyorsszabályokat betméret szerint:</b></p>
<ul><li>1/3 pot → 20%</li><li>1/2 pot → 25%</li><li>2/3 pot → 28,6%</li><li>3/4 pot → 30%</li><li>Pot → 33%</li><li>2× pot → 40%</li></ul>
<p><b>3. Hasonlítsd össze az equityddel.</b> Turnön outok × 2. Callolj, ha az equityd nagyobb, és dobj, ha kisebb. Az implied odds (a későbbi utcákon nyerhető pénz) igazolhat egy kicsit alulmaradó callt is.</p>`,

ro:{eqHowTitle:"Cum estimezi equity-ul",
  eqHow:`<p><b>1. Numără-ți outs-urile.</b> Outs-urile sunt cărțile care te pun în avantaj: un draw de culoare are 9, un draw de chintă deschisă 8, un gutshot 4, două overcard-uri cam 6.</p>
<p><b>2. Regula lui 4 și 2.</b> Pe flop, cu două cărți de venit: outs × 4. Pe turn, cu o carte de venit: outs × 2. Cu mai mult de 8 outs pe flop, scade outs-urile în plus: 15 outs ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Dacă ești în avantaj,</b> numără outs-urile adversarului și ia restul: el are 9 outs pe flop ≈ 36%, deci tu ai cam 64%.</p>
<p><b>4. Preflop, învață duelurile clasice</b> (partea favoritului):</p>
<ul><li>Pereche mai mare contra pereche mai mică (KK contra QQ): ≈ 80%</li><li>Pereche contra două cărți mai mici (QQ contra JT): ≈ 80%</li><li>Pereche contra un overcard (QQ contra AJ): ≈ 70%</li><li>Mână dominată, carte comună (AK contra AQ): ≈ 70%</li><li>Două overcard-uri contra două cărți mai mici (AK contra 98): ≈ 60%</li><li>Pereche contra două overcard-uri (QQ contra AK): ≈ 55%, cap sau pajură</li></ul>`,

  poHowTitle:"Cum faci calculul",
  poHow:`<p><b>1. Equity necesar = call-ul tău ÷ potul final.</b> Potul final e potul, plus pariul, plus call-ul tău: pariu ÷ (pot + 2 × pariu).</p>
<p class="ex">Exemplu: potul e 100 și adversarul pariază 50. Plătești 50 ca să câștigi un pot final de 200: 50 ÷ 200 = 25%.</p>
<p><b>2. Învață scurtăturile după mărimea pariului:</b></p>
<ul><li>1/3 pot → 20%</li><li>1/2 pot → 25%</li><li>2/3 pot → 28,6%</li><li>3/4 pot → 30%</li><li>Pot → 33%</li><li>2× pot → 40%</li></ul>
<p><b>3. Compară cu equity-ul tău.</b> Pe turn, outs × 2. Fă call dacă equity-ul tău e mai mare și fold dacă e mai mic. Implied odds (banii pe care îi poți câștiga pe străzile următoare) pot justifica un call puțin sub prag.</p>`,

uk:{eqHowTitle:"Як оцінити еквіті",
  eqHow:`<p><b>1. Порахуй свої аути.</b> Аути — це карти, які виводять тебе вперед: у флеш-дро їх 9, у відкритому стріт-дро 8, у гатшоті 4, у двох оверкартах приблизно 6.</p>
<p><b>2. Правило 4 і 2.</b> На флопі, коли попереду дві карти: аути × 4. На терні, коли попереду одна карта: аути × 2. Якщо на флопі в тебе більше 8 аутів, відніми зайві: 15 аутів ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Якщо ти попереду,</b> порахуй аути суперника і візьми решту: у нього 9 аутів на флопі ≈ 36 %, тож у тебе приблизно 64 %.</p>
<p><b>4. Префлоп запам'ятай класичні розклади</b> (частка фаворита):</p>
<ul><li>Старша пара проти молодшої (KK проти QQ): ≈ 80 %</li><li>Пара проти двох молодших карт (QQ проти JT): ≈ 80 %</li><li>Пара проти однієї оверкарти (QQ проти AJ): ≈ 70 %</li><li>Домінована рука, спільна карта (AK проти AQ): ≈ 70 %</li><li>Дві оверкарти проти двох молодших карт (AK проти 98): ≈ 60 %</li><li>Пара проти двох оверкарт (QQ проти AK): ≈ 55 %, практично монетка</li></ul>`,
  ruleOf:n=>`Правило ${n}`,
  youOuts:(o,rule,est)=>`Ти позаду. Твої аути: <b>${o}</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Ти попереду; аути суперника: <b>${o}</b>. ${rule} ≈ ${est} % для нього, тож у тебе приблизно <b>${mine} %</b>.`,
  mu:{pp:"старша пара проти молодшої",pover2:"пара проти двох оверкарт",pover1:"пара проти однієї оверкарти",punder:"пара проти двох молодших карт",dom:"домінована рука (спільна карта)",over:"дві оверкарти проти двох молодших карт",mixed:"по одній старшій карті в кожного"},

  poHowTitle:"Як рахувати",
  poHow:`<p><b>1. Потрібне еквіті = твій кол ÷ підсумковий банк.</b> Підсумковий банк — це банк, плюс ставка, плюс твій кол: ставка ÷ (банк + 2 × ставка).</p>
<p class="ex">Приклад: у банку 100, суперник ставить 50. Ти колиш 50, щоб виграти підсумковий банк 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Запам'ятай орієнтири за розміром ставки:</b></p>
<ul><li>1/3 банку → 20 %</li><li>1/2 банку → 25 %</li><li>2/3 банку → 28,6 %</li><li>3/4 банку → 30 %</li><li>Банк → 33 %</li><li>2× банк → 40 %</li></ul>
<p><b>3. Порівняй зі своїм еквіті.</b> На терні: аути × 2. Колюй, якщо твоє еквіті вище, фолдь, якщо нижче. Імплайд-оддси (гроші, які можна виграти на наступних вулицях) можуть виправдати кол, якому трохи бракує.</p>`,

bg:{eqHowTitle:"Как да прецениш еквитито",
  eqHow:`<p><b>1. Преброй аутовете си.</b> Аутовете са картите, които те изкарват напред: флъш дро има 9, отворено дро за кента 8, гътшот 4, две овъркарти около 6.</p>
<p><b>2. Правило на 4 и 2.</b> На флопа, с две карти до края: аутове × 4. На търна, с една карта до края: аутове × 2. С повече от 8 аута на флопа извади излишните: 15 аута ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Ако си напред,</b> преброй аутовете на противника и вземи остатъка: той има 9 аута на флопа ≈ 36 %, значи ти имаш около 64 %.</p>

nl:{eqHowTitle:"Zo schat je je equity",
  eqHow:`<p><b>1. Tel je outs.</b> Outs zijn de kaarten die je op voorsprong zetten: een flush draw heeft er 9, een open-ended straight draw 8, een gutshot 4, twee overcards ongeveer 6.</p>
<p><b>2. Regel van 4 en 2.</b> Op de flop, met nog twee kaarten te komen: outs × 4. Op de turn, met nog één kaart te komen: outs × 2. Met meer dan 8 outs op de flop trek je de extra outs eraf: 15 outs ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Sta je voor,</b> tel dan de outs van je tegenstander en neem de rest: hij heeft 9 outs op de flop ≈ 36%, dus jij hebt ongeveer 64%.</p>
<p><b>4. Leer preflop de klassieke matchups</b> (het aandeel van de favoriet):</p>
<ul><li>Hoger paar tegen lager paar (KK tegen QQ): ≈ 80%</li><li>Paar tegen twee lagere kaarten (QQ tegen JT): ≈ 80%</li><li>Paar tegen één overcard (QQ tegen AJ): ≈ 70%</li><li>Gedomineerde hand, gedeelde kaart (AK tegen AQ): ≈ 70%</li><li>Twee overcards tegen twee lagere kaarten (AK tegen 98): ≈ 60%</li><li>Paar tegen twee overcards (QQ tegen AK): ≈ 55%, een coinflip</li></ul>`,
  ruleOf:n=>`Regel van ${n}`,
  youOuts:(o,rule,est)=>`Je ligt achter met <b>${o} outs</b>. ${rule} ≈ <b>${est}%</b>.`,
  vilOuts:(o,rule,est,mine)=>`Je staat voor; je tegenstander heeft <b>${o} outs</b>. ${rule} ≈ ${est}% voor hem, dus ongeveer <b>${mine}%</b> voor jou.`,
  mu:{pp:"hoger paar tegen lager paar",pover2:"paar tegen twee overcards",pover1:"paar tegen één overcard",punder:"paar tegen twee lagere kaarten",dom:"gedomineerde hand (gedeelde kaart)",over:"twee overcards tegen twee lagere kaarten",mixed:"elk één hoge kaart"},
  muLine:(name,fav)=>`Matchup: ${name}. De favoriet heeft meestal ongeveer <b>${fav}%</b>.`,
  poHowTitle:"Zo reken je het uit",
  poHow:`<p><b>1. Benodigde equity = je call ÷ de eindpot.</b> De eindpot is de pot, plus de bet, plus je call: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Voorbeeld: de pot is 100 en je tegenstander bet 50. Je callt 50 om een eindpot van 200 te winnen: 50 ÷ 200 = 25%.</p>
<p><b>2. Leer de vuistregels per betgrootte:</b></p>
<ul><li>1/3 pot → 20%</li><li>1/2 pot → 25%</li><li>2/3 pot → 28,6%</li><li>3/4 pot → 30%</li><li>Pot → 33%</li><li>2× pot → 40%</li></ul>
<p><b>3. Vergelijk met je equity.</b> Op de turn: outs × 2. Call als je equity hoger is, fold als die lager is. Implied odds (geld dat je op latere straten kunt winnen) kunnen een call rechtvaardigen die net tekortschiet.</p>`,

sv:{eqHowTitle:"Så uppskattar du din equity",
  eqHow:`<p><b>1. Räkna dina outs.</b> Outs är korten som tar dig i ledning: ett flush draw har 9, ett öppet straight draw 8, en gutshot 4, två overcards ungefär 6.</p>
<p><b>2. 4- och 2-regeln.</b> På floppen, med två kort kvar: outs × 4. På turn, med ett kort kvar: outs × 2. Med fler än 8 outs på floppen drar du av de extra outsen: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Om du leder,</b> räkna motståndarens outs och ta resten: hen har 9 outs på floppen ≈ 36 %, så du har ungefär 64 %.</p>
<p><b>4. Lär dig de klassiska matchupsen preflop</b> (favoritens andel):</p>
<ul><li>Högre par mot lägre par (KK mot QQ): ≈ 80 %</li><li>Par mot två lägre kort (QQ mot JT): ≈ 80 %</li><li>Par mot ett overcard (QQ mot AJ): ≈ 70 %</li><li>Dominerad hand, delat kort (AK mot AQ): ≈ 70 %</li><li>Två overcards mot två lägre kort (AK mot 98): ≈ 60 %</li><li>Par mot två overcards (QQ mot AK): ≈ 55 %, ett myntkast</li></ul>`,
  ruleOf:n=>`${n}-regeln`,
  youOuts:(o,rule,est)=>`Du ligger efter med <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Du leder; motståndaren har <b>${o} outs</b>. ${rule} ≈ ${est} % för hen, så ungefär <b>${mine} %</b> för dig.`,
  mu:{pp:"högre par mot lägre par",pover2:"par mot två overcards",pover1:"par mot ett overcard",punder:"par mot två lägre kort",dom:"dominerad hand (delat kort)",over:"två overcards mot två lägre kort",mixed:"ett högt kort var"},
  muLine:(name,fav)=>`Matchup: ${name}. Favoriten har oftast ungefär <b>${fav} %</b>.`,
  poHowTitle:"Så räknar du",
  poHow:`<p><b>1. Krävd equity = din call ÷ slutpotten.</b> Slutpotten är potten, plus betten, plus din call: bet ÷ (pott + 2 × bet).</p>
<p class="ex">Exempel: potten är 100 och motståndaren bettar 50. Du callar 50 för att vinna en slutpott på 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Lär dig genvägarna efter betstorlek:</b></p>
<ul><li>1/3 pott → 20 %</li><li>1/2 pott → 25 %</li><li>2/3 pott → 28,6 %</li><li>3/4 pott → 30 %</li><li>Pott → 33 %</li><li>2× pott → 40 %</li></ul>
<p><b>3. Jämför med din equity.</b> På turn: outs × 2. Calla om din equity är högre, folda om den är lägre. Implied odds (pengar du kan vinna på senare gator) kan motivera en call som är lite för tunn.</p>`,

da:{eqHowTitle:"Sådan anslår du din equity",
  eqHow:`<p><b>1. Tæl dine outs.</b> Outs er de kort, der bringer dig foran: et flush draw har 9, et åbent straight draw 8, et gutshot 4, to overcards cirka 6.</p>
<p><b>2. 4- og 2-reglen.</b> På floppet, med to kort tilbage: outs × 4. På turn, med ét kort tilbage: outs × 2. Med flere end 8 outs på floppet trækker du de ekstra outs fra: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Hvis du er foran,</b> så tæl din modstanders outs og tag resten: de har 9 outs på floppet ≈ 36 %, så du har cirka 64 %.</p>
<p><b>4. Lær de klassiske matchups preflop</b> (favorittens andel):</p>
<ul><li>Højere par mod lavere par (KK mod QQ): ≈ 80 %</li><li>Par mod to lavere kort (QQ mod JT): ≈ 80 %</li><li>Par mod ét overcard (QQ mod AJ): ≈ 70 %</li><li>Domineret hånd, fælles kort (AK mod AQ): ≈ 70 %</li><li>To overcards mod to lavere kort (AK mod 98): ≈ 60 %</li><li>Par mod to overcards (QQ mod AK): ≈ 55 %, et coinflip</li></ul>`,
  ruleOf:n=>`${n}-reglen`,
  youOuts:(o,rule,est)=>`Du er bagud med <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Du er foran; din modstander har <b>${o} outs</b>. ${rule} ≈ ${est} % til dem, så cirka <b>${mine} %</b> til dig.`,
  mu:{pp:"højere par mod lavere par",pover2:"par mod to overcards",pover1:"par mod ét overcard",punder:"par mod to lavere kort",dom:"domineret hånd (fælles kort)",over:"to overcards mod to lavere kort",mixed:"ét højt kort hver"},
  muLine:(name,fav)=>`Matchup: ${name}. Favoritten har som regel cirka <b>${fav} %</b>.`,
  poHowTitle:"Sådan regner du det ud",
  poHow:`<p><b>1. Krævet equity = dit call ÷ den endelige pot.</b> Den endelige pot er potten plus bettet plus dit call: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Eksempel: potten er 100, og din modstander better 50. Du caller 50 for at vinde en endelig pot på 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Lær genvejene efter betstørrelse:</b></p>
<ul><li>1/3 pot → 20 %</li><li>1/2 pot → 25 %</li><li>2/3 pot → 28,6 %</li><li>3/4 pot → 30 %</li><li>Pot → 33 %</li><li>2× pot → 40 %</li></ul>
<p><b>3. Sammenlign med din equity.</b> På turn: outs × 2. Call, hvis din equity er højere, fold, hvis den er lavere. Implied odds (penge du kan vinde på senere streets) kan retfærdiggøre et call, der er lidt for tyndt.</p>`,

nb:{eqHowTitle:"Slik anslår du equity",
  eqHow:`<p><b>1. Tell outsene dine.</b> Outs er kortene som setter deg foran: en flushdraw har 9, en åpen straightdraw 8, en gutshot 4, to overcards omtrent 6.</p>
<p><b>2. 4- og 2-regelen.</b> På floppen, med to kort igjen: outs × 4. På turn, med ett kort igjen: outs × 2. Med mer enn 8 outs på floppen trekker du fra de ekstra outsene: 15 outs ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Hvis du ligger foran,</b> tell motstanderens outs og ta resten: de har 9 outs på floppen ≈ 36 %, så du har omtrent 64 %.</p>
<p><b>4. Preflop: lær de klassiske duellene</b> (favorittens andel):</p>
<ul><li>Større par mot mindre par (KK mot QQ): ≈ 80 %</li><li>Par mot to lavere kort (QQ mot JT): ≈ 80 %</li><li>Par mot ett overcard (QQ mot AJ): ≈ 70 %</li><li>Dominert hånd, felles kort (AK mot AQ): ≈ 70 %</li><li>To overcards mot to lavere kort (AK mot 98): ≈ 60 %</li><li>Par mot to overcards (QQ mot AK): ≈ 55 %, et myntkast</li></ul>`,
  ruleOf:n=>`${n}-regelen`,
  youOuts:(o,rule,est)=>`Du ligger bak med <b>${o} outs</b>. ${rule} ≈ <b>${est} %</b>.`,
  vilOuts:(o,rule,est,mine)=>`Du ligger foran; motstanderen har <b>${o} outs</b>. ${rule} ≈ ${est} % for dem, så omtrent <b>${mine} %</b> for deg.`,
  mu:{pp:"større par mot mindre par",pover2:"par mot to overcards",pover1:"par mot ett overcard",punder:"par mot to lavere kort",dom:"dominert hånd (felles kort)",over:"to overcards mot to lavere kort",mixed:"ett høyt kort hver"},
  muLine:(name,fav)=>`Duell: ${name}. Favoritten har vanligvis omtrent <b>${fav} %</b>.`,
  poHowTitle:"Slik regner du det ut",
  poHow:`<p><b>1. Nødvendig equity = callen din ÷ den endelige potten.</b> Den endelige potten er potten, pluss beten, pluss callen din: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Eksempel: potten er 100 og motstanderen better 50. Du caller 50 for å vinne en endelig pot på 200: 50 ÷ 200 = 25 %.</p>
<p><b>2. Lær snarveiene etter betstørrelse:</b></p>
<ul><li>1/3 pot → 20 %</li><li>1/2 pot → 25 %</li><li>2/3 pot → 28,6 %</li><li>3/4 pot → 30 %</li><li>Pot → 33 %</li><li>2× pot → 40 %</li></ul>
<p><b>3. Sammenlign med equityen din.</b> På turn: outs × 2. Call hvis equityen din er høyere, fold hvis den er lavere. Implied odds (penger du kan vinne på senere streets) kan forsvare en call som er litt for tynn.</p>`,

tr:{eqHowTitle:"Equity nasıl tahmin edilir",
  eqHow:`<p><b>1. Out'larını say.</b> Out'lar seni öne geçiren kartlardır: floş draw'unda 9, açık uçlu kent draw'unda 8, gutshot'ta 4, iki overcard'da yaklaşık 6 out vardır.</p>
<p><b>2. 4 ve 2 kuralı.</b> Flop'ta, gelecek iki kartla: out × 4. Turn'de, gelecek bir kartla: out × 2. Flop'ta 8'den fazla out varsa fazla out'ları çıkar: 15 out ≈ 15 × 4 − 7 = %53.</p>
<p><b>3. Öndeysen,</b> rakibinin out'larını say ve kalanı al: rakibinin flop'ta 9 out'u varsa ≈ %36, yani senin equity'n yaklaşık %64.</p>
<p><b>4. Preflop'ta klasik eşleşmeleri öğren</b> (favorinin payı):</p>
<ul><li>Büyük per vs küçük per (KK vs QQ): ≈ %80</li><li>Per vs iki küçük kart (QQ vs JT): ≈ %80</li><li>Per vs bir overcard (QQ vs AJ): ≈ %70</li><li>Domine el, ortak kart (AK vs AQ): ≈ %70</li><li>İki overcard vs iki küçük kart (AK vs 98): ≈ %60</li><li>Per vs iki overcard (QQ vs AK): ≈ %55, yazı tura</li></ul>`,
  ruleOf:n=>`${n} kuralı`,
  youOuts:(o,rule,est)=>`Gerideysin. Out sayın: <b>${o}</b>. ${rule} ≈ <b>%${est}</b>.`,
  vilOuts:(o,rule,est,mine)=>`Öndesin; rakibinin out sayısı: <b>${o}</b>. ${rule} ≈ onun için %${est}, yani senin için yaklaşık <b>%${mine}</b>.`,
  mu:{pp:"büyük per vs küçük per",pover2:"per vs iki overcard",pover1:"per vs bir overcard",punder:"per vs iki küçük kart",dom:"domine el (ortak kart)",over:"iki overcard vs iki küçük kart",mixed:"iki tarafta da birer yüksek kart"},
  muLine:(name,fav)=>`Eşleşme: ${name}. Favorinin equity'si genelde yaklaşık <b>%${fav}</b>.`,
  poHowTitle:"Hesap nasıl yapılır",
  poHow:`<p><b>1. Gereken equity = call'ın ÷ final pot.</b> Final pot; pot, artı bet, artı senin call'ındır: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Örnek: pot 100 ve rakibin 50 bet ediyor. 200'lük bir final potu kazanmak için 50 call edersin: 50 ÷ 200 = %25.</p>
<p><b>2. Bet boyutuna göre kısayolları öğren:</b></p>
<ul><li>1/3 pot → %20</li><li>1/2 pot → %25</li><li>2/3 pot → %28,6</li><li>3/4 pot → %30</li><li>Pot → %33</li><li>2× pot → %40</li></ul>
<p><b>3. Equity'nle karşılaştır.</b> Turn'de out × 2. Equity'n daha yüksekse call et, daha düşükse fold et. Implied odds (sonraki street'lerde kazanabileceğin para) biraz eksik kalan bir call'ı haklı çıkarabilir.</p>`,

vi:{eqHowTitle:"Cách ước lượng equity",
  eqHow:`<p><b>1. Đếm outs của bạn.</b> Outs là những lá giúp bạn vượt lên: draw thùng có 9, draw sảnh hai đầu có 8, gutshot có 4, hai overcard khoảng 6.</p>
<p><b>2. Quy tắc 4 và 2.</b> Ở flop, còn hai lá: outs × 4. Ở turn, còn một lá: outs × 2. Nếu có hơn 8 outs ở flop, hãy trừ bớt số outs dư: 15 outs ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Nếu bạn đang dẫn,</b> đếm outs của đối thủ và lấy phần còn lại: họ có 9 outs ở flop ≈ 36%, vậy bạn có khoảng 64%.</p>
<p><b>4. Ở preflop, hãy nhớ các thế đối đầu kinh điển</b> (phần của bên cửa trên):</p>
<ul><li>Đôi lớn vs đôi nhỏ (KK vs QQ): ≈ 80%</li><li>Đôi vs hai lá nhỏ hơn (QQ vs JT): ≈ 80%</li><li>Đôi vs một overcard (QQ vs AJ): ≈ 70%</li><li>Bài bị dominate, chung một lá (AK vs AQ): ≈ 70%</li><li>Hai overcard vs hai lá nhỏ hơn (AK vs 98): ≈ 60%</li><li>Đôi vs hai overcard (QQ vs AK): ≈ 55%, một kèo coin flip</li></ul>`,
  ruleOf:n=>`Quy tắc ${n}`,
  youOuts:(o,rule,est)=>`Bạn đang bị dẫn, có <b>${o} outs</b>. ${rule} ≈ <b>${est}%</b>.`,
  vilOuts:(o,rule,est,mine)=>`Bạn đang dẫn; đối thủ có <b>${o} outs</b>. ${rule} ≈ ${est}% cho họ, vậy bạn có khoảng <b>${mine}%</b>.`,
  mu:{pp:"đôi lớn vs đôi nhỏ",pover2:"đôi vs hai overcard",pover1:"đôi vs một overcard",punder:"đôi vs hai lá nhỏ hơn",dom:"bài bị dominate (chung một lá)",over:"hai overcard vs hai lá nhỏ hơn",mixed:"mỗi bên một lá cao"},
  muLine:(name,fav)=>`Thế đối đầu: ${name}. Bên cửa trên thường có khoảng <b>${fav}%</b>.`,
  poHowTitle:"Cách tính toán",
  poHow:`<p><b>1. Equity cần = tiền call của bạn ÷ pot cuối.</b> Pot cuối là pot, cộng bet, cộng tiền call của bạn: bet ÷ (pot + 2 × bet).</p>
<p class="ex">Ví dụ: pot là 100 và đối thủ bet 50. Bạn call 50 để thắng pot cuối 200: 50 ÷ 200 = 25%.</p>
<p><b>2. Nhớ các mốc nhanh theo size bet:</b></p>
<ul><li>1/3 pot → 20%</li><li>1/2 pot → 25%</li><li>2/3 pot → 28,6%</li><li>3/4 pot → 30%</li><li>Pot → 33%</li><li>2× pot → 40%</li></ul>
<p><b>3. So sánh với equity của bạn.</b> Ở turn, outs × 2. Call nếu equity của bạn cao hơn, fold nếu thấp hơn. Implied odds (tiền bạn có thể thắng thêm ở các street sau) có thể biện minh cho một call hơi thiếu một chút.</p>`,

th:{eqHowTitle:"วิธีประเมิน equity",
  eqHow:`<p><b>1. นับ outs ของคุณ</b> Outs คือไพ่ที่ทำให้คุณขึ้นนำ: flush draw มี 9 ใบ open-ended straight draw มี 8 ใบ gutshot มี 4 ใบ และ overcard สองใบมีประมาณ 6 ใบ</p>
<p><b>2. กฎคูณ 4 และคูณ 2</b> บน flop ที่ยังเหลือไพ่อีกสองใบ: outs × 4 บน turn ที่เหลือไพ่อีกหนึ่งใบ: outs × 2 ถ้ามี outs มากกว่า 8 บน flop ให้ลบ outs ส่วนที่เกินออก: 15 outs ≈ 15 × 4 − 7 = 53%</p>
<p><b>3. ถ้าคุณนำอยู่</b> ให้นับ outs ของคู่ต่อสู้แล้วเอาส่วนที่เหลือ: เขามี 9 outs บน flop ≈ 36% คุณจึงมีประมาณ 64%</p>
<p><b>4. Preflop ให้จำ matchup คลาสสิก</b> (ส่วนแบ่งของฝ่ายที่เป็นต่อ):</p>

hi:{eqHowTitle:"Equity का अंदाज़ा कैसे लगाएँ",
  eqHow:`<p><b>1. अपने outs गिनो।</b> Outs वो कार्ड हैं जो तुम्हें आगे कर देते हैं: flush draw के 9, open-ended straight draw के 8, gutshot के 4, दो overcard के लगभग 6।</p>
<p><b>2. 4 और 2 का नियम।</b> Flop पर, जब दो कार्ड आने बाकी हों: outs × 4। Turn पर, जब एक कार्ड बाकी हो: outs × 2। Flop पर 8 से ज़्यादा outs हों तो एक्स्ट्रा outs घटा दो: 15 outs ≈ 15 × 4 − 7 = 53%।</p>
<p><b>3. अगर तुम आगे हो,</b> तो विलेन के outs गिनो और बाकी तुम्हारा: flop पर उसके 9 outs ≈ 36%, तो तुम्हारे पास लगभग 64% है।</p>
<p><b>4. Preflop में क्लासिक matchup याद रखो</b> (favorite का हिस्सा):</p>
<ul><li>बड़ा पेयर बनाम छोटा पेयर (KK बनाम QQ): ≈ 80%</li><li>पेयर बनाम दो छोटे कार्ड (QQ बनाम JT): ≈ 80%</li><li>पेयर बनाम एक overcard (QQ बनाम AJ): ≈ 70%</li><li>Dominated हैंड, एक कार्ड कॉमन (AK बनाम AQ): ≈ 70%</li><li>दो overcard बनाम दो छोटे कार्ड (AK बनाम 98): ≈ 60%</li><li>पेयर बनाम दो overcard (QQ बनाम AK): ≈ 55%, यानी coin flip</li></ul>`,
  ruleOf:n=>`${n} का नियम`,
  youOuts:(o,rule,est)=>`तुम पीछे हो, तुम्हारे पास <b>${o} outs</b> हैं। ${rule} ≈ <b>${est}%</b>।`,
  vilOuts:(o,rule,est,mine)=>`तुम आगे हो; विलेन के पास <b>${o} outs</b> हैं। ${rule} ≈ उसके लिए ${est}%, तो तुम्हारे लिए लगभग <b>${mine}%</b>।`,

  muLine:(name,fav)=>`Matchup: ${name}। Favorite के पास आम तौर पर लगभग <b>${fav}%</b> होता है।`,
  poHowTitle:"हिसाब कैसे लगाएँ",
  poHow:`<p><b>1. ज़रूरी equity = तुम्हारा call ÷ फ़ाइनल पॉट।</b> फ़ाइनल पॉट यानी पॉट, plus bet, plus तुम्हारा call: bet ÷ (पॉट + 2 × bet)।</p>
<p class="ex">उदाहरण: पॉट 100 है और विलेन 50 bet करता है। तुम 200 का फ़ाइनल पॉट जीतने के लिए 50 call करते हो: 50 ÷ 200 = 25%।</p>
<p><b>2. Bet साइज़ के हिसाब से shortcut याद रखो:</b></p>
<ul><li>1/3 पॉट → 20%</li><li>1/2 पॉट → 25%</li><li>2/3 पॉट → 28.6%</li><li>3/4 पॉट → 30%</li><li>पॉट → 33%</li><li>2× पॉट → 40%</li></ul>
<p><b>3. अपनी equity से तुलना करो।</b> Turn पर, outs × 2। Equity ज़्यादा हो तो call करो, कम हो तो fold करो। Implied odds (बाद की streets पर जो पैसा जीत सकते हो) थोड़ा कम पड़ रहे call को भी सही ठहरा सकते हैं।</p>`,

zht:{eqHowTitle:"如何估算勝率",
  eqHow:`<p><b>1. 數你的 outs。</b>Outs 是能讓你領先的牌：同花聽牌有 9 張，兩頭順聽牌 8 張，卡順聽牌 4 張，兩張高牌約 6 張。</p>
<p><b>2. 4 和 2 法則。</b>翻牌時還有兩張牌要發：outs × 4。轉牌時還有一張牌要發：outs × 2。翻牌時 outs 超過 8 張，要減去多出來的 outs：15 張 outs ≈ 15 × 4 − 7 = 53%。</p>
<p><b>3. 如果你領先，</b>就數對手的 outs，剩下的就是你的：對手在翻牌有 9 張 outs ≈ 36%，所以你約有 64%。</p>
<p><b>4. 翻牌前，記住經典對決</b>（優勢方的勝率）：</p>
<ul><li>大對子 vs 小對子（KK vs QQ）：≈ 80%</li><li>對子 vs 兩張低牌（QQ vs JT）：≈ 80%</li><li>對子 vs 一張高牌（QQ vs AJ）：≈ 70%</li><li>被壓制的牌，共用一張牌（AK vs AQ）：≈ 70%</li><li>兩張高牌 vs 兩張低牌（AK vs 98）：≈ 60%</li><li>對子 vs 兩張高牌（QQ vs AK）：≈ 55%，接近擲硬幣</li></ul>`,
  ruleOf:n=>`${n} 法則`,
  youOuts:(o,rule,est)=>`你落後，有 <b>${o} 張 outs</b>。${rule} ≈ <b>${est}%</b>。`,
  vilOuts:(o,rule,est,mine)=>`你領先；對手有 <b>${o} 張 outs</b>。${rule} ≈ 對手 ${est}%，所以你約有 <b>${mine}%</b>。`,
  mu:{pp:"大對子 vs 小對子",pover2:"對子 vs 兩張高牌",pover1:"對子 vs 一張高牌",punder:"對子 vs 兩張低牌",dom:"被壓制的牌（共用一張牌）",over:"兩張高牌 vs 兩張低牌",mixed:"雙方各有一張大牌"},
  muLine:(name,fav)=>`對決：${name}。優勢方通常約有 <b>${fav}%</b>。`,
  poHowTitle:"如何計算",
  poHow:`<p><b>1. 所需勝率 = 你的跟注 ÷ 最終底池。</b>最終底池是底池加上下注，再加上你的跟注：下注 ÷（底池 + 2 × 下注）。</p>
<p class="ex">例子：底池 100，對手下注 50。你跟注 50，爭取 200 的最終底池：50 ÷ 200 = 25%。</p>
<p><b>2. 記住各下注尺度的捷徑：</b></p>
<ul><li>1/3 底池 → 20%</li><li>1/2 底池 → 25%</li><li>2/3 底池 → 28.6%</li><li>3/4 底池 → 30%</li><li>底池 → 33%</li><li>2× 底池 → 40%</li></ul>
<p><b>3. 和你的勝率比較。</b>轉牌時用 outs × 2。勝率較高就跟注，較低就棄牌。隱含賠率（之後幾條街還能贏的錢）可以讓略微不足的跟注變得合理。</p>`,

fi:{eqHowTitle:"Näin arvioit equityn",
  eqHow:`<p><b>1. Laske outsisi.</b> Outsit ovat kortit, jotka nostavat sinut johtoon: värivedolla on 9, avoimella suoravedolla 8, gutshotilla 4, kahdella overcardilla noin 6.</p>
<p><b>2. 4:n ja 2:n sääntö.</b> Flopissa, kun kaksi korttia on tulossa: outsit × 4. Turnissa, kun yksi kortti on tulossa: outsit × 2. Jos flopissa on yli 8 outsia, vähennä ylimenevät outsit: 15 outsia ≈ 15 × 4 − 7 = 53 %.</p>
<p><b>3. Jos olet edellä,</b> laske vastustajasi outsit ja ota loput: hänellä on 9 outsia flopissa ≈ 36 %, joten sinulla on noin 64 %.</p>
<p><b>4. Preflopissa opettele klassiset asetelmat</b> (suosikin osuus):</p>
<ul><li>Isompi pari vastaan pienempi pari (KK vs QQ): ≈ 80 %</li><li>Pari vastaan kaksi alempaa korttia (QQ vs JT): ≈ 80 %</li><li>Pari vastaan yksi overcard (QQ vs AJ): ≈ 70 %</li><li>Dominoitu käsi, yhteinen kortti (AK vs AQ): ≈ 70 %</li><li>Kaksi overcardia vastaan kaksi alempaa korttia (AK vs 98): ≈ 60 %</li><li>Pari vastaan kaksi overcardia (QQ vs AK): ≈ 55 %, kolikonheitto</li></ul>`,
  ruleOf:n=>`${n}:n sääntö`,
  youOuts:(o,rule,est)=>`Olet jäljessä, ja sinulla on <b>${o} outsia</b>. ${rule} ≈ <b>${est} %</b>.`,

  poHowTitle:"Näin lasket",
  poHow:`<p><b>1. Tarvittava equity = callisi ÷ lopullinen potti.</b> Lopullinen potti on potti plus panos plus callisi: panos ÷ (potti + 2 × panos).</p>
<p class="ex">Esimerkki: potissa on 100 ja vastustajasi panostaa 50. Maksat 50 voittaaksesi 200:n lopullisen potin: 50 ÷ 200 = 25 %.</p>
<p><b>2. Opettele oikotiet panoskoon mukaan:</b></p>
<ul><li>1/3 potti → 20 %</li><li>1/2 potti → 25 %</li><li>2/3 potti → 28,6 %</li><li>3/4 potti → 30 %</li><li>Potti → 33 %</li><li>2× potti → 40 %</li></ul>
<p><b>3. Vertaa equityysi.</b> Turnissa outsit × 2. Maksa, jos equitysi on suurempi, ja foldaa, jos se on pienempi. Implied oddsit (raha, jonka voit voittaa myöhemmillä kaduilla) voivat oikeuttaa callin, joka jää hieman vajaaksi.</p>`,

el:{eqHowTitle:"Πώς να υπολογίσεις το equity",
  eqHow:`<p><b>1. Μέτρα τα outs σου.</b> Outs είναι τα φύλλα που σε βάζουν μπροστά: ένα τράβηγμα χρώματος έχει 9, ένα ανοιχτό τράβηγμα κέντας 8, ένα gutshot 4, δύο overcards περίπου 6.</p>
<p><b>2. Κανόνας του 4 και του 2.</b> Στο flop, με δύο φύλλα να έρθουν: outs × 4. Στο turn, με ένα φύλλο να έρθει: outs × 2. Με πάνω από 8 outs στο flop, αφαίρεσε τα επιπλέον outs: 15 outs ≈ 15 × 4 − 7 = 53%.</p>
<p><b>3. Αν είσαι μπροστά,</b> μέτρα τα outs του αντιπάλου σου και κράτα τα υπόλοιπα: έχει 9 outs στο flop ≈ 36%, οπότε εσύ έχεις περίπου 64%.</p>
<p><b>4. Preflop, μάθε τις κλασικές αναμετρήσεις</b> (το ποσοστό του φαβορί):</p>
<ul><li>Μεγαλύτερο ζευγάρι απέναντι σε μικρότερο (KK vs QQ): ≈ 80%</li><li>Ζευγάρι απέναντι σε δύο χαμηλότερα φύλλα (QQ vs JT): ≈ 80%</li><li>Ζευγάρι απέναντι σε ένα overcard (QQ vs AJ): ≈ 70%</li><li>Dominated χέρι, κοινό φύλλο (AK vs AQ): ≈ 70%</li><li>Δύο overcards απέναντι σε δύο χαμηλότερα φύλλα (AK vs 98): ≈ 60%</li><li>Ζευγάρι απέναντι σε δύο overcards (QQ vs AK): ≈ 55%, κορόνα-γράμματα</li></ul>`,

  poHowTitle:"Πώς να κάνεις τον υπολογισμό",
  poHow:`<p><b>1. Απαιτούμενο equity = το call σου ÷ το τελικό pot.</b> Το τελικό pot είναι το pot, συν το ποντάρισμα, συν το call σου: ποντάρισμα ÷ (pot + 2 × ποντάρισμα).</p>
<p class="ex">Παράδειγμα: το pot είναι 100 και ο αντίπαλός σου ποντάρει 50. Πληρώνεις 50 για να κερδίσεις τελικό pot 200: 50 ÷ 200 = 25%.</p>
<p><b>2. Μάθε τις συντομεύσεις ανά μέγεθος πονταρίσματος:</b></p>
<ul><li>1/3 pot → 20%</li><li>1/2 pot → 25%</li><li>2/3 pot → 28,6%</li><li>3/4 pot → 30%</li><li>Pot → 33%</li><li>2× pot → 40%</li></ul>
<p><b>3. Σύγκρινε με το equity σου.</b> Στο turn, outs × 2. Κάνε call αν το equity σου είναι μεγαλύτερο, fold αν είναι μικρότερο. Τα implied odds (λεφτά που μπορείς να κερδίσεις στα επόμενα streets) μπορούν να δικαιολογήσουν ένα call που υστερεί λίγο.</p>`,

const B=[371293,28561,2197,169,13,1];
function sc5(cat,ks){let v=cat*B[0];for(let i=0;i<ks.length;i++)v+=ks[i]*B[i+1];return v}

function topBits(m,k){const o=[];for(let r=12;r>=0&&o.length<k;r--)if(m>>r&1)o.push(r);return o}
function evalH(cs){
  const rc=new Int8Array(13),sm=[0,0,0,0],sc=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sm[s]|=1<<r;sc[s]++;mask|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(sc[s]>=5)fs=s;
  if(fs>=0){const h=straightHigh(sm[fs]);if(h>=0)return sc5(8,[h])}
  const q=[],tr=[],p=[],x=[];
  for(let r=12;r>=0;r--){const n=rc[r];if(n===4)q.push(r);else if(n===3)tr.push(r);else if(n===2)p.push(r);else if(n===1)x.push(r)}
  if(q.length){let k=-1;for(let r=12;r>=0;r--)if(r!==q[0]&&rc[r]){k=r;break}return sc5(7,[q[0],k])}
  if(tr.length&&(tr.length>1||p.length)){const pp=tr.length>1?Math.max(tr[1],p.length?p[0]:-1):p[0];return sc5(6,[tr[0],pp])}
  if(fs>=0)return sc5(5,topBits(sm[fs],5));
  const st=straightHigh(mask);if(st>=0)return sc5(4,[st]);
  if(tr.length)return sc5(3,[tr[0],x[0],x[1]]);
  if(p.length>=2)return sc5(2,[p[0],p[1],Math.max(p.length>2?p[2]:-1,x.length?x[0]:-1)]);
  if(p.length===1)return sc5(1,[p[0],x[0],x[1],x[2]]);
  return sc5(0,x.slice(0,5));
}

function equity(h,v,board){
  const used=new Set([...h,...v,...board]),rest=[];for(let c=0;c<52;c++)if(!used.has(c))rest.push(c);
  const need=5-board.length;let win=0,tie=0,n=0;
  const run=b=>{const a=evalH(h.concat(b)),o=evalH(v.concat(b));if(a>o)win++;else if(a===o)tie++;n++};
  if(need===0)run(board);
  else if(need===1)for(const c of rest)run(board.concat([c]));
  else if(need===2){for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++)run(board.concat([rest[i],rest[j]]))}
  else{for(let it=0;it<6000;it++){const b=board.slice();for(let k=0;k<need;k++){const j=k+rnd(rest.length-k);[rest[k],rest[j]]=[rest[j],rest[k]];b.push(rest[k])}run(b)}}
  return {eq:(win+tie/2)/n,win:win/n,tie:tie/n,n,exact:need<=2};
}

/* ---------- Preflop: folded to you, fold / limp / raise ----------
   Classical play is raise or fold; open-limping is a leak, except from the small blind where completing
   medium hands against the big blind is standard. The "players behind" profile shifts the right answer:
   nits fold too much (open wider), aggressive players 3-bet a lot (open tighter, limp-trap AA/KK vs a maniac),
   passive players rarely raise (speculative hands can limp from late position). */

/* ---------- Equity: heads-up all-in, everyone else folded ---------- */
/* Outs for the player who is behind now: next cards that put them strictly ahead. */
function outsInfo(h,v,board){const used=new Set([...h,...v,...board]);
  const heroAhead=evalH(h.concat(board))>=evalH(v.concat(board));let outs=0;
  for(let c=0;c<52;c++){if(used.has(c))continue;const a=evalH(h.concat(board,[c])),b=evalH(v.concat(board,[c]));if(heroAhead?b>a:a>b)outs++}
  return {heroAhead,outs}}
function matchup(h,v){const rh=h.map(c=>c>>2).sort((a,b)=>b-a),rv=v.map(c=>c>>2).sort((a,b)=>b-a);
  const ph=rh[0]===rh[1],pv=rv[0]===rv[1];
  if(ph&&pv)return ["pp",80];
  if(ph||pv){const p=ph?rh[0]:rv[0],o=ph?rv:rh,n=o.filter(r=>r>p).length;return n===2?["pover2",55]:n===1?["pover1",70]:["punder",80]}
  if(rh.some(r=>rv.includes(r)))return ["dom",70];
  if(Math.min(...rh)>Math.max(...rv)||Math.min(...rv)>Math.max(...rh))return ["over",60];
  return ["mixed","55–60"]}
function eqWorked(){
  if(!eq.board.length){const [k,f]=matchup(eq.h,eq.v);return t().muLine(t().mu[k],f)}
  const {heroAhead,outs}=outsInfo(eq.h,eq.v,eq.board),flop=eq.board.length===3;
  const est=Math.min(100,flop?(outs>8?outs*4-(outs-8):outs*4):outs*2);
  const rule=flop?`${t().ruleOf(4)}: ${outs} × 4${outs>8?` − ${outs-8}`:""}`:`${t().ruleOf(2)}: ${outs} × 2`;
  return heroAhead?t().vilOuts(outs,rule,est,100-est):t().youOuts(outs,rule,est)}

const BUCKETS=["0–20 %","20–40 %","40–60 %","60–80 %","80–100 %"];
let eq;

function boardCenter(ctx,board,extra){return `<div class="ctx">${ctx}</div><div class="row">${cardsHTML(board,"md")}${ghosts(5-board.length,"md")}</div>${extra?`<div class="cact">${extra}</div>`:""}`}
function newEquity(){

  const ord=ORDER(),hero=ord[rnd(ord.length)];let vil;do vil=ord[rnd(ord.length)];while(vil===hero);

    center:boardCenter(`${stName} · ${t().allin}`,eq.board)});

    return `<p>${t().eqFb(f(r.eq),f(r.win),f(r.tie))}</p>${cur}<p>${eqWorked()}</p><p class="muted">${r.exact?t().exact(r.n):t().mc(r.n)}</p>`});

const OUTS=[9,8,4,15,6,12,5];
const SIZES=[1/3,1/2,2/3,3/4,1,1.5,2];
let po;
function newPotOdds(){
  const pot=(4+rnd(37))*5,si=rnd(SIZES.length),bet=Math.max(5,Math.round(pot*SIZES[si]/5)*5);
  const need=bet/(pot+2*bet);

    const opts=new Set([Math.round(need*100)]);const cands=[bet/(pot+bet),bet/pot,bet/(2*(pot+bet)),need+.08,need-.07,need+.15];
    for(const c of cands){if(opts.size>=4)break;const v=Math.round(c*100);if(v>2&&v<98&&![...opts].some(o=>Math.abs(o-v)<3))opts.add(v)}
    const list=shuffle([...opts]);po={type:"req",pot,bet,si,need,list,correct:list.indexOf(Math.round(need*100)),chosen:null};
