<title>Hold'em Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow app-like column; the felt "table" holds the cards, answers are big thumb buttons. */
:root{
  --bg:#eef1ec; --surface:#ffffff; --ink:#15201b; --muted:#5a6a61; --line:#d3ddd6;
  --felt:#1e5a44; --felt-2:#174a37; --on-felt:#eaf3ee; --brass:#a87a22; --brass-soft:#f3e6c8;
  --good:#1c7a45; --good-soft:#dcefe3; --bad:#b23838; --bad-soft:#f6dede;
  --card-bg:#fbfbf8; --card-edge:#c9cfc9; --s:#16181a; --h:#c62828; --d:#1d5cc0; --c:#1f8040;
  --in:#2f7a5c; --in-ink:#ffffff; --out:#e4e9e5; --out-ink:#7b8a82; --tb:#b4532d; --rail:#5a3a24; --rail-edge:#3b2516; --back-a:#a33232; --back-b:#842626;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1512; --surface:#16201b; --ink:#e5ece8; --muted:#93a39a; --line:#2a3832;
  --felt:#1b4d3a; --felt-2:#143c2d; --on-felt:#e3efe8; --brass:#d8a748; --brass-soft:#3a2f17;
  --good:#52c486; --good-soft:#173826; --bad:#e46d6d; --bad-soft:#3d1d1d;
  --card-bg:#f1f2ee; --card-edge:#9aa39d; --in:#2f8a66; --in-ink:#ffffff; --out:#1d2924; --out-ink:#5f7068; --tb:#c8653c; --rail:#3d281a; --rail-edge:#24170e; --back-a:#9a3030; --back-b:#7a2323;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1512; --surface:#16201b; --ink:#e5ece8; --muted:#93a39a; --line:#2a3832;
  --felt:#1b4d3a; --felt-2:#143c2d; --on-felt:#e3efe8; --brass:#d8a748; --brass-soft:#3a2f17;
  --good:#52c486; --good-soft:#173826; --bad:#e46d6d; --bad-soft:#3d1d1d;
  --card-bg:#f1f2ee; --card-edge:#9aa39d; --in:#2f8a66; --in-ink:#ffffff; --out:#1d2924; --out-ink:#5f7068; --tb:#c8653c; --rail:#3d281a; --rail-edge:#24170e; --back-a:#9a3030; --back-b:#7a2323;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:30px;letter-spacing:.01em;line-height:1;text-transform:uppercase}
.brand span{color:var(--brass)}
.tagline{font-size:12px;color:var(--muted);margin-top:4px;letter-spacing:.02em}
.right{display:flex;align-items:center;gap:12px}
.streak{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:6px;font-variant-numeric:tabular-nums}
.streak b{color:var(--ink)}
.lang{display:inline-flex;border:1.5px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{white-space:nowrap;background:none;border:0;padding:3px 10px;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.gear{background:none;border:1.5px solid var(--line);border-radius:999px;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
.gear:hover{border-color:var(--brass)}
.gear svg{width:18px;height:18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;width:100%;max-width:420px;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:18px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:800;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.field{display:flex;flex-direction:column;gap:8px}
.field .t{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.field select{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--in);flex:none}
.check b{display:block;font-weight:600}
.check small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.check.off{opacity:.5;cursor:default}
.sheet .next{align-self:flex-end}
.field .lang{align-self:flex-start} .field .lang button{padding:6px 14px;font-size:13px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:8px 12px 10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brass)}

.table{background:radial-gradient(120% 90% at 50% 30%,var(--felt) 0%,var(--felt-2) 100%);color:var(--on-felt);
  border-radius:22px;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.ctx{font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.8}
.big{font-family:var(--f-display);font-weight:800;font-size:34px;line-height:1;letter-spacing:.02em}
.row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.seat{display:flex;flex-direction:column;align-items:center;gap:6px}
.seat small{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.seats{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px;background:rgba(0,0,0,.22);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}

.card{width:46px;height:64px;border-radius:7px;background:var(--card-bg);border:1px solid var(--card-edge);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.card b{font-family:var(--f-display);font-size:26px;font-weight:800}
.card i{font-style:normal;font-size:20px;margin-top:2px}
.card.s{color:var(--s)} .card.h{color:var(--h)} .card.d{color:var(--d)} .card.c{color:var(--c)}
.card.lg{width:58px;height:80px} .card.lg b{font-size:32px} .card.lg i{font-size:24px}
.card.ghost{background:transparent;border:1.5px dashed rgba(255,255,255,.3);box-shadow:none}
.seat.win .row .card{outline:3px solid var(--brass);outline-offset:1px}

/* full 6-max table: hero always sits bottom-centre, the others follow clockwise in order of play */
.ring{position:relative;height:340px;width:100%;max-width:560px;margin:0 auto}
.oval{position:absolute;inset:8% 5% 17% 5%;border-radius:50%;background:radial-gradient(110% 90% at 50% 35%,var(--felt) 0%,var(--felt-2) 100%);
  box-shadow:0 0 0 10px var(--rail),0 0 0 12px var(--rail-edge),inset 0 0 28px rgba(0,0,0,.35)}
.center{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center;color:var(--on-felt);display:flex;flex-direction:column;gap:2px;width:52%}
.center .ctx{font-size:11px}
.potv{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.cact{font-size:12px;opacity:.9}
.pseat{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
.pseat.hero{transform:translateX(-50%);left:50%;bottom:0}
.pbox{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:2px 9px;font-size:12px;font-weight:700;line-height:1.25;text-align:center;min-width:56px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pbox small{display:block;font-weight:500;color:var(--muted);font-size:11px;white-space:nowrap}
.pseat.fold{opacity:.42}
.pseat.win .pbox{border-color:var(--brass);box-shadow:0 0 0 3px var(--brass)}
.ring.n9{height:410px}
.ring.n9 .pseat.hero .card.lg{width:46px;height:64px} .ring.n9 .pseat.hero .card.lg b{font-size:26px} .ring.n9 .pseat.hero .card.lg i{font-size:20px}
.center .row{gap:3px}
.card.sm{width:25px;height:35px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.3)} .card.sm b{font-size:16px} .card.sm i{font-size:11px;margin-top:0}
.card.md{width:34px;height:47px;border-radius:5px} .card.md b{font-size:20px} .card.md i{font-size:14px;margin-top:1px}
.card.md.ghost{border-width:1px}
.pseat.hero .pbox{border-color:var(--brass);background:var(--brass-soft)}
.pseat.raise .pbox,.pseat.limp .pbox{border-color:var(--tb)} .pseat.limp .pbox small{color:var(--tb);font-weight:700} .pseat.raise .pbox small{color:var(--tb);font-weight:700}
.mini{display:flex;gap:2px;min-height:24px;align-items:flex-end}
.mini span:not(.card){width:17px;height:24px;border-radius:3px;background:repeating-linear-gradient(45deg,var(--back-a) 0 3px,var(--back-b) 3px 6px);border:1.5px solid var(--card-bg)}
.bet{position:absolute;transform:translate(-50%,-50%);font-family:var(--f-mono);font-size:12px;color:var(--on-felt);display:flex;align-items:center;gap:4px;z-index:1;font-variant-numeric:tabular-nums}
.bet i{width:11px;height:11px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset}
.dbtn{position:absolute;transform:translate(-50%,-50%);width:20px;height:20px;border-radius:50%;background:var(--card-bg);color:var(--s);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4);z-index:1}
@media (max-width:420px){.ring{height:310px}.ring.n9{height:380px}.card.md{width:30px;height:42px}.card.md b{font-size:18px}.pbox{min-width:48px;padding:2px 6px}.potv{font-size:22px}}
.q{font-weight:600;font-size:16px;text-align:center}
.answers{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.ans{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;font-weight:600;font-size:16px;
  font-variant-numeric:tabular-nums;transition:transform .08s,border-color .15s}
.ans:hover:not(:disabled){border-color:var(--brass)}
.ans:active:not(:disabled){transform:scale(.97)}
.ans kbd{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:500;margin-top:2px}
.ans.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.ans.ko{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.ans:disabled{cursor:default}

.fb{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em}
.verdict.ok{color:var(--good)} .verdict.ko{color:var(--bad)}
.fb p{margin:0} .fb .muted{color:var(--muted);font-size:13px}
.next{align-self:flex-start;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:10px 18px;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.grid-wrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(13,minmax(22px,1fr));gap:2px;min-width:300px;font-family:var(--f-mono);font-size:10px}
.grid div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:3px;background:var(--out);color:var(--out-ink);letter-spacing:-.03em}
.grid div.in{background:var(--in);color:var(--in-ink)}
.grid div.tb{background:var(--tb);color:var(--in-ink)}
.grid div.cur{outline:3px solid var(--brass);outline-offset:-1px;position:relative;z-index:1;font-weight:700}

.study{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
.study summary{cursor:pointer;font-weight:600;padding:10px 0}
.study .bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.pill{border:1.5px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.study .pct{font-size:13px;color:var(--muted);margin:8px 0 12px}

.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bar .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-right:2px}
.villains{display:flex;flex-direction:column;gap:12px}
.villains .verdict{color:var(--ink)}
.intro{background:var(--brass-soft);border-color:var(--brass)}
.intro .verdict{color:var(--brass)}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.poplist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.src{font-size:12px;color:var(--muted)} .src a{color:inherit}
.facts span{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.stats{display:flex;flex-direction:column;gap:10px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.srow h3{margin:0;font-size:15px}
.srow .val{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;text-align:right}
.meter{grid-column:1/-1;height:6px;border-radius:3px;background:var(--out);overflow:hidden}
.meter span{display:block;height:100%;background:var(--in)}
.srow .sub{grid-column:1/-1;font-size:12px;color:var(--muted)}
.reset{align-self:flex-start;background:none;border:1.5px solid var(--bad);color:var(--bad);border-radius:10px;padding:8px 14px;font-weight:600}
.note{font-size:12px;color:var(--muted);text-align:center}
.hint{font-size:12px;color:var(--muted);text-align:center}
@media (hover:none){.ans kbd,.hint{display:none}}
@media (max-width:420px){.card{width:40px;height:56px}.card b{font-size:22px}.card i{font-size:17px}.card.lg{width:52px;height:72px}.big{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div><div class="brand">Hold'em <span>Drill</span></div><div class="tagline" data-t="tagline"></div></div>
    <div class="right">
      <div class="streak" aria-live="polite"><span data-t="streak"></span> <b id="streak">0</b> · <span data-t="best"></span> <b id="best">0</b></div>
      <button class="gear" id="open-settings" aria-haspopup="dialog" data-tl="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="preflop" data-t="tabPreflop"></button>
    <button class="tab" role="tab" data-view="defense" data-t="tabDefense"></button>
    <button class="tab" role="tab" data-view="villains" data-t="tabVillains"></button>
    <button class="tab" role="tab" data-view="equity" data-t="tabEquity"></button>
    <button class="tab" role="tab" data-view="potodds" data-t="tabPotodds"></button>
    <button class="tab" role="tab" data-view="showdown" data-t="tabShowdown"></button>
    <button class="tab" role="tab" data-view="stats" data-t="tabStats"></button>
  </nav>

  <section id="v-preflop" hidden>
    <div class="ring" id="pf-table"></div>
    <p class="q" data-t="pfQ"></p>
    <div class="answers" id="pf-ans"></div>
    <div class="fb" id="pf-fb" hidden></div>
    <details class="study" id="study">
      <summary data-t="study"></summary>
      <div class="bar" id="study-pos"></div>
      <div class="grid-wrap"><div class="grid" id="study-grid"></div></div>
      <p class="pct" id="study-pct"></p>
    </details>
  </section>

  <section id="v-defense" hidden>
    <div class="bar" id="df-prof"></div>
    <div class="ring" id="df-table"></div>
    <p class="q" id="df-q"></p>
    <div class="answers" id="df-ans"></div>
    <div class="fb" id="df-fb" hidden></div>
    <details class="study">
      <summary data-t="dfStudy"></summary>
      <div class="bar" id="dstudy-spot"></div>
      <div class="grid-wrap"><div class="grid" id="dstudy-grid"></div></div>
      <p class="pct" id="dstudy-pct"></p>
      <p class="pct" data-t="epNote"></p>
    </details>
  </section>

  <section id="v-equity" hidden>
    <div class="ring" id="eq-table"></div>
    <p class="q" data-t="eqQ"></p>
    <div class="answers" id="eq-ans"></div>
    <div class="fb" id="eq-fb" hidden></div>
  </section>

  <section id="v-potodds" hidden>
    <div class="table" id="po-table"></div>
    <p class="q" id="po-q"></p>
    <div class="answers" id="po-ans"></div>
    <div class="fb" id="po-fb" hidden></div>
  </section>

  <section id="v-showdown" hidden>
    <div class="ring" id="sd-table"></div>
    <p class="q" data-t="sdQ"></p>
    <div class="answers" id="sd-ans"></div>
    <div class="fb" id="sd-fb" hidden></div>
  </section>

  <section id="v-villains" hidden>
    <div class="villains">
      <div class="fb intro" id="vp-intro"></div>
      <div class="bar" id="vp-prof"></div>
      <div class="fb" id="vp-card"></div>
      <div class="bar" id="vp-pos"></div>
      <div class="grid-wrap"><div class="grid" id="vp-grid"></div></div>
      <p class="pct" id="vp-pct"></p>
    </div>
  </section>

  <section id="v-stats" hidden>
    <div class="stats" id="stats"></div>
  </section>

  <div class="modal" id="settings" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="set-title">
      <h2 id="set-title" data-t="settings"></h2>
      <div class="field">
        <label class="t" for="set-lang" data-t="setLang"></label>
        <select id="set-lang">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="es">Español</option>
          <option value="pt">Português (Brasil)</option>
          <option value="de">Deutsch</option>
          <option value="it">Italiano</option>
        </select>
      </div>

const R="23456789TJQKA", SU=["s","h","d","c"], SYM={s:"♠",h:"♥",d:"♦",c:"♣"};
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- cards ---------- */
function cardHTML(c,lg){const r=R[c>>2],s=SU[c&3];return `<span class="card ${s}${lg===true?" lg":lg?" "+lg:""}" aria-label="${r}${s}"><b>${r==="T"?"10":r}</b><i>${SYM[s]}</i></span>`}
function cardsHTML(cs,lg){return cs.map(c=>cardHTML(c,lg)).join("")}
function ghosts(n,cls){return `<span class="card ghost${cls?" "+cls:""}"></span>`.repeat(n)}
function deal(n,ex){const used=new Set(ex||[]),out=[];while(out.length<n){const c=rnd(52);if(!used.has(c)){used.add(c);out.push(c)}}return n===2?out.sort((a,b)=>b-a):out}
function handCode(a,b){let r1=a>>2,r2=b>>2;if(r1<r2)[r1,r2]=[r2,r1];if(r1===r2)return R[r1]+R[r2];return R[r1]+R[r2]+((a&3)===(b&3)?"s":"o")}

/* ---------- 5-7 card evaluator ---------- */
const B=[371293,28561,2197,169,13,1];
function sc5(cat,ks){let v=cat*B[0];for(let i=0;i<ks.length;i++)v+=ks[i]*B[i+1];return v}
function straightHigh(m){for(let h=12;h>=4;h--){const n=0x1F<<(h-4);if((m&n)===n)return h}return (m&0x100F)===0x100F?3:-1}
function topBits(m,k){const o=[];for(let r=12;r>=0&&o.length<k;r--)if(m>>r&1)o.push(r);return o}
function evalH(cs){
  const rc=new Int8Array(13),sm=[0,0,0,0],sc=[0,0,0,0];let mask=0;
  for(const c of cs){const r=c>>2,s=c&3;rc[r]++;sm[s]|=1<<r;sc[s]++;mask|=1<<r}
  let fs=-1;for(let s=0;s<4;s++)if(sc[s]>=5)fs=s;
  if(fs>=0){const h=straightHigh(sm[fs]);if(h>=0)return sc5(8,[h])}
  const q=[],tr=[],p=[],x=[];
  for(let r=12;r>=0;r--){const n=rc[r];if(n===4)q.push(r);else if(n===3)tr.push(r);else if(n===2)p.push(r);else if(n===1)x.push(r)}
  if(q.length){let k=-1;for(let r=12;r>=0;r--)if(r!==q[0]&&rc[r]){k=r;break}return sc5(7,[q[0],k])}
  if(tr.length&&(tr.length>1||p.length)){const pp=tr.length>1?Math.max(tr[1],p.length?p[0]:-1):p[0];return sc5(6,[tr[0],pp])}
  if(fs>=0)return sc5(5,topBits(sm[fs],5));
  const st=straightHigh(mask);if(st>=0)return sc5(4,[st]);
  if(tr.length)return sc5(3,[tr[0],x[0],x[1]]);
  if(p.length>=2)return sc5(2,[p[0],p[1],Math.max(p.length>2?p[2]:-1,x.length?x[0]:-1)]);
  if(p.length===1)return sc5(1,[p[0],x[0],x[1],x[2]]);
  return sc5(0,x.slice(0,5));
}
function handName(score){const c=Math.floor(score/B[0]);if(c===8&&Math.floor(score%B[0]/B[1])===12)return t().royal;return t().cat[c]}

function equity(h,v,board){
  const used=new Set([...h,...v,...board]),rest=[];for(let c=0;c<52;c++)if(!used.has(c))rest.push(c);
  const need=5-board.length;let win=0,tie=0,n=0;
  const run=b=>{const a=evalH(h.concat(b)),o=evalH(v.concat(b));if(a>o)win++;else if(a===o)tie++;n++};
  if(need===0)run(board);
  else if(need===1)for(const c of rest)run(board.concat([c]));
  else if(need===2){for(let i=0;i<rest.length;i++)for(let j=i+1;j<rest.length;j++)run(board.concat([rest[i],rest[j]]))}
  else{for(let it=0;it<6000;it++){const b=board.slice();for(let k=0;k<need;k++){const j=k+rnd(rest.length-k);[rest[k],rest[j]]=[rest[j],rest[k]];b.push(rest[k])}run(b)}}
  return {eq:(win+tie/2)/n,win:win/n,tie:tie/n,n,exact:need<=2};
}

/* ---------- table size, positions, ranges ---------- */
const SKEY="holdem-drill-size";
let size=6;try{const z=+localStorage.getItem(SKEY);if(z===9)size=9}catch(e){}
const ORDERS={6:["UTG","HJ","CO","BTN","SB","BB"],9:["UTG","UTG1","UTG2","LJ","HJ","CO","BTN","SB","BB"]};
const ORDER=()=>ORDERS[size];
const OPENERS=()=>ORDER().filter(p=>p!=="BB");
const lbl=p=>({UTG1:"UTG+1",UTG2:"UTG+2"})[p]||p;
const RANGE_SRC={
  UTG:"22+,A2s+,K9s+,Q9s+,J9s+,T9s,98s,87s,76s,65s,ATo+,KJo+,QJo",
  HJ:"22+,A2s+,K7s+,Q9s+,J9s+,T8s+,98s,87s,76s,65s,54s,A9o+,KTo+,QTo+,JTo",
  CO:"22+,A2s+,K4s+,Q7s+,J7s+,T7s+,97s+,86s+,75s+,65s,54s,A7o+,A5o,K9o+,Q9o+,J9o+,T9o",
  BTN:"22+,A2s+,K2s+,Q3s+,J5s+,T6s+,96s+,85s+,74s+,64s+,53s+,43s,A2o+,K8o+,Q9o+,J8o+,T8o+,98o,87o",
  SB:"22+,A2s+,K2s+,Q5s+,J7s+,T7s+,96s+,86s+,75s+,64s+,54s,A2o+,K9o+,Q9o+,J9o+,T9o",

  UTG9:"77+,A9s+,A5s,KTs+,QTs+,JTs,T9s,AJo+,KQo",
  UTG1:"66+,A8s+,A5s,A4s,KTs+,QTs+,JTs,T9s,98s,AJo+,KQo",
  UTG2:"55+,A7s+,A5s-A3s,K9s+,Q9s+,J9s+,T9s,98s,87s,ATo+,KJo+"
};
/* Notation: "22+", "A2s+", "JJ-55", "A5s-A2s", "AK" (= AKs + AKo), "AQ+" */
function expand(src){const set=new Set();
  const add=(hi,lo,ty)=>{if(ty)set.add(R[hi]+R[lo]+ty);else{set.add(R[hi]+R[lo]+"s");set.add(R[hi]+R[lo]+"o")}};
  for(let tok of src.split(",")){tok=tok.trim();if(!tok)continue;
  if(tok.includes("-")){const [x,y]=tok.split("-"),a=R.indexOf(x[0]),b=R.indexOf(x[1]);
    if(a===b){const c=R.indexOf(y[0]);for(let r=Math.min(a,c);r<=Math.max(a,c);r++)set.add(R[r]+R[r])}
    else{const hi=Math.max(a,b),k1=Math.min(a,b),k2=R.indexOf(y[1]);for(let l=Math.min(k1,k2);l<=Math.max(k1,k2);l++)add(hi,l,x[2])}
    continue}
  const plus=tok.endsWith("+");if(plus)tok=tok.slice(0,-1);
  const a=R.indexOf(tok[0]),b=R.indexOf(tok[1]);
  if(a===b){if(plus)for(let r=a;r<13;r++)set.add(R[r]+R[r]);else set.add(tok)}
  else{const hi=Math.max(a,b),lo=Math.min(a,b),ty=tok[2];if(plus)for(let l=lo;l<hi;l++)add(hi,l,ty);else add(hi,lo,ty)}}
  return set}
const RANGES={};for(const k in RANGE_SRC)RANGES[k]=expand(RANGE_SRC[k]);
const rangeFor=pos=>RANGES[size===9?({UTG:"UTG9",LJ:"UTG"})[pos]||pos:pos];
const combos=code=>code.length===2?6:code[2]==="s"?4:12;
const pct=set=>{let n=0;for(const c of set)n+=combos(c);return Math.round(n/1326*1000)/10};
function gridHTML(set,cur){let h="";for(let i=0;i<13;i++)for(let j=0;j<13;j++){const a=12-i,b=12-j;
  const code=i===j?R[a]+R[a]:j>i?R[a]+R[b]+"s":R[b]+R[a]+"o";
  h+=`<div class="${set.has(code)?"in":""}${code===cur?" cur":""}">${code}</div>`}return h}

/* ---------- full table view ----------
   The bottom seat is always the player we look from; the others follow clockwise in order of play.
   seats: {POS:{st:"fold"|"wait"|"raise"|"hero"|"show", bet, cards, sub, win}} */
const BLIND={SB:.5,BB:1};
const bb=x=>{const v=Number.isInteger(x)?String(x):x.toFixed(1);return (lang!=="en"?v.replace(".",","):v)+"bb"};
function seatXY(k,n){const a=(90+k*360/n)*Math.PI/180;return [50+41*Math.cos(a),45+37*Math.sin(a)]}
function tableView(o){
  const ord=ORDER(),n=ord.length,bi=ord.indexOf(o.bottom);let h='<div class="oval"></div>';
  for(let k=0;k<n;k++){const pos=ord[(bi+k)%n],a=o.seats[pos]||{st:"fold"},bet=a.bet||0,win=a.win?" win":"";
    if(k===0){
      h+=`<div class="pseat hero${win}"><div class="row">${cardsHTML(o.bottomCards,true)}</div><div class="pbox">${o.bottomLabel}${o.bottomSub?`<small class="mono">${o.bottomSub}</small>`:""}</div></div>`;
      if(bet)h+=`<div class="bet" style="left:50%;top:63%"><i></i>${bb(bet)}</div>`;
    }else{
      const [x,y]=seatXY(k,n);
      const sub=a.sub!=null?a.sub:a.st==="fold"?t().folded:a.st==="raise"?`${t().raiseLbl} ${bb(bet)}`:bet?bb(bet):t().toAct;
      const cards=a.cards?cardsHTML(a.cards,"sm"):a.st==="fold"?"":"<span></span><span></span>";
      h+=`<div class="pseat ${a.st}${win}" style="left:${x}%;top:${y}%"><div class="mini">${cards}</div><div class="pbox">${lbl(pos)}<small>${sub}</small></div></div>`;
      if(bet)h+=`<div class="bet" style="left:${x+(50-x)*.45}%;top:${y+(45-y)*.45}%"><i></i>${bb(bet)}</div>`;
    }
    if(pos==="BTN"){let x,y;if(k===0){x=74;y=78}else{[x,y]=seatXY(k,n);const mid=Math.abs(x-50)<3;x=mid?x+13:x+(x<50?11:-11);y=mid?y+4:y+(y<45?3:-3)}
      h+=`<div class="dbtn" style="left:${x}%;top:${y}%">D</div>`}
  }
  return h+`<div class="center">${o.center}</div>`;
}
function paintRing(id,o){const el=$(id);el.className="ring n"+ORDER().length;el.innerHTML=tableView(o)}
/* preflop situations: everyone before the hero folded, the opener (if any) raised */
function actsFor(hero,opener,oSt,oBet){const ord=ORDER(),hi=ord.indexOf(hero),oi=opener?ord.indexOf(opener):-1,acts={};
  ord.forEach((p,i)=>{const blind=BLIND[p]||0;
    if(i===hi)acts[p]={st:"hero",bet:blind};
    else if(i===oi)acts[p]={st:oSt||"raise",bet:oBet||2.5};
    else if(i<hi)acts[p]={st:"fold",bet:blind};
    else acts[p]={st:"wait",bet:blind}});
  return acts}
function preflopRing(id,hero,cards,code,opener,action,tag,oSt,oBet){
  const seats=actsFor(hero,opener,oSt,oBet);
  if(opener){const a=seats[opener];a.sub=oSt==="limp"?`${tag?tag+" · ":""}Limp`:tag?`${tag} · ${bb(a.bet)}`:undefined}let pot=0;for(const p in seats)pot+=seats[p].bet||0;
  paintRing(id,{bottom:hero,bottomCards:cards,bottomLabel:`${t().you} · ${lbl(hero)}`,bottomSub:code,seats,
    center:`<div class="ctx">${t().pos[hero]}</div><div class="potv">${t().pot} ${bb(pot)}</div><div class="cact">${action}</div>`});
}

/* ---------- Preflop ---------- */
let pf;
function newPreflop(){
  const ops=OPENERS(),pos=ops[rnd(ops.length)];let h,code;
  for(let k=0;k<12;k++){h=deal(2);code=handCode(h[0],h[1]);
    const inAny=RANGES.BTN.has(code)||RANGES.SB.has(code);
    const obvious=rangeFor(ops[0]).has(code)&&pos!==ops[0];
    if(!(inAny?obvious&&Math.random()<.5:Math.random()<.7))break}
  const raise=rangeFor(pos).has(code);
  pf={size,pos,h,code,raise,correct:raise?1:0,chosen:null};paintPreflop();
}
function paintPreflop(){
  preflopRing("pf-table",pf.pos,pf.h,pf.code,null,t().pfCtx);
  paintAnswers($("pf-ans"),[t().fold,t().raise],pf,["F","R"]);
  const set=rangeFor(pf.pos);
  paintFb($("pf-fb"),pf,()=>`<p>${t().pfFb(pf.code,pf.raise,lbl(pf.pos),pct(set))}</p><div class="grid-wrap"><div class="grid">${gridHTML(set,pf.code)}</div></div><p class="muted">${t().legend}</p>`);
}
$("pf-ans").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer("preflop",pf,+b.dataset.i,paintPreflop)});

  BBvUTG9:"BB vs tight UTG",BBvEP:"BB vs EP",BBvCO:"BB vs CO",BBvBTN:"BB vs BTN",BBvSB:"BB vs SB"};
const DEF={};for(const k in DEF_SRC){const tb=expand(DEF_SRC[k].tb),call=expand(DEF_SRC[k].call);for(const c of tb)call.delete(c);DEF[k]={tb,call}}
for(const c of ALL169)if(!DEF.LimpBB.tb.has(c))DEF.LimpBB.call.add(c);
const VALUE=expand("TT+,AQ+,AJs,KQs");
/* The chart depends on how wide the opener plays (W, % of hands), not only on the seat. */
function band(W){const w=k=>pct(RANGES[k]);
  if(W<=(w("UTG9")+w("UTG"))/2)return "U9";if(W<=(w("HJ")+w("CO"))/2)return "EP";if(W<=(w("CO")+w("BTN"))/2)return "CO";return "BTN"}
function defKey(o,h,W){const b=band(W);
  if(h==="SB")return b==="U9"?"SBvUTG9":b==="EP"?"SBvEP":"SBvLate";
  if(h==="BB"){if(o==="SB"&&(b==="CO"||b==="BTN"))return "BBvSB";return {U9:"BBvUTG9",EP:"BBvEP",CO:"BBvCO",BTN:"BBvBTN"}[b]}
  return b==="U9"?"IPvUTG9":b==="EP"?"IPvEP":"IPvCO"}
function chartFor(key,prof,hero){const sp=DEF[key];if(!LIMPERS[prof]||key.startsWith("Limp"))return sp;
  const tb=new Set(),call=new Set(sp.call);for(const c of sp.tb){if(VALUE.has(c))tb.add(c);else if(hero==="BB")call.add(c)}return {tb,call}}
function spots(){const ord=ORDER(),n=ord.length,out=[];for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++)out.push([ord[i],ord[j]]);return out}
function grid3(sp,cur){let h="";for(let i=0;i<13;i++)for(let j=0;j<13;j++){const a=12-i,b=12-j;
  const code=i===j?R[a]+R[a]:j>i?R[a]+R[b]+"s":R[b]+R[a]+"o";
  h+=`<div class="${sp.tb.has(code)?"tb":sp.call.has(code)?"in":""}${code===cur?" cur":""}">${code}</div>`}return h}
const DPKEY="holdem-drill-opp";
let dProf="gto";try{let v=localStorage.getItem(DPKEY);v=({classical:"gto",fish:"station"})[v]||v;if(v&&(v==="random"||PROFILES.includes(v)))dProf=v}catch(e){}
function paintDProf(){$("df-prof").innerHTML=`<span class="lbl">${t().oppLbl}</span>`+PROFILES.concat(["random"]).map(k=>`<button class="pill" aria-pressed="${k===dProf}" data-prof="${k}">${k==="random"?t().random:t().prof[k]}</button>`).join("")}
$("df-prof").addEventListener("click",e=>{const b=e.target.closest("[data-prof]");if(!b||b.dataset.prof===dProf)return;
  dProf=b.dataset.prof;try{localStorage.setItem(DPKEY,dProf)}catch(err){}paintDProf();newDefense()});
let df;
function newDefense(){
  const prof=dProf==="random"?PROFILES[rnd(PROFILES.length)]:dProf;
  const all=spots(),[o,hero]=all[rnd(all.length)];
  const limp=!!LIMPERS[prof]&&Math.random()<LIMPERS[prof].pLimp;
  const W=limp?pct(LIMPERS[prof].limp):pct(openRange(prof,o));
  const key=limp?(hero==="BB"?"LimpBB":hero==="SB"?"LimpSB":"LimpIP"):defKey(o,hero,W),sp=chartFor(key,prof,hero);let h,code;
  for(let k=0;k<12;k++){h=deal(2);code=handCode(h[0],h[1]);if(sp.tb.has(code)||sp.call.has(code)||Math.random()>.7)break}
  const bbLimp=limp&&hero==="BB";
  const correct=bbLimp?(sp.tb.has(code)?1:0):sp.tb.has(code)?2:sp.call.has(code)?1:0;
  df={size,prof,o,hero,W,key,limp,h,code,correct,chosen:null};paintDefense();
}
function dfLabels(){if(!df.limp)return {labels:[t().fold,t().call,"3-bet"],keys:["F","C","3"],acts:t().acts,q:t().dfQ};
  if(df.hero==="BB")return {labels:[t().check,t().iso],keys:["C","R"],acts:t().actsLimpBB,q:t().dfQLimpBB};
  return {labels:[t().fold,df.hero==="SB"?t().complete:t().limpB,t().iso],keys:["F","C","R"],acts:t().actsLimp,q:t().dfQLimp}}
function paintDefense(){
  const pn=t().prof[df.prof],tag=df.prof==="gto"?"":({station:"Station",live:"Live rec"})[df.prof]||pn,L=dfLabels();
  const action=(df.limp?t().dfLimp(lbl(df.o)):t().dfOpen(lbl(df.o)).replace("2.5bb",bb(PSIZE[df.prof])).replace("2,5bb",bb(PSIZE[df.prof])))+(tag?` (${tag})`:"");
  preflopRing("df-table",df.hero,df.h,df.code,df.o,action,tag,df.limp?"limp":"raise",df.limp?1:PSIZE[df.prof]);
  $("df-q").textContent=L.q;
  paintAnswers($("df-ans"),L.labels,df,L.keys);
  const sp=chartFor(df.key,df.prof,df.hero);
  const why=df.limp?`<p class="muted">${t().limpWhy(pn,Math.round(df.W),lbl(df.o))}</p><p class="muted">${t().isoNote}</p>`
    :`<p class="muted">${t().vsProf(pn,lbl(df.o),Math.round(df.W),DEF_LABEL[df.key])}</p>${LIMPERS[df.prof]?`<p class="muted">${t().passiveNote}</p>`:""}${df.hero==="SB"?`<p class="muted">${t().dfSb}</p>`:""}`;
  paintFb($("df-fb"),df,()=>`<p>${t().dfFb(df.code,L.acts[df.correct],lbl(df.hero)+" vs "+lbl(df.o))}</p>${why}<div class="grid-wrap"><div class="grid">${grid3(sp,df.code)}</div></div><p class="muted">${df.limp?t().legendLimp:t().legend3}</p>`);
}
$("df-ans").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer("defense",df,+b.dataset.i,paintDefense)});
let dStudy="BBvBTN";
function paintDStudy(){
  $("dstudy-spot").innerHTML=Object.keys(DEF).map(k=>`<button class="pill" aria-pressed="${k===dStudy}" data-spot="${k}">${DEF_LABEL[k]}</button>`).join("");
  $("dstudy-grid").innerHTML=grid3(DEF[dStudy],"");
  $("dstudy-pct").textContent=t().dfPct(pct(DEF[dStudy].tb),pct(DEF[dStudy].call))+" "+t().legend3;
}
$("dstudy-spot").addEventListener("click",e=>{const b=e.target.closest("[data-spot]");if(b){dStudy=b.dataset.spot;paintDStudy()}});

/* ---------- Opponents: study each profile's opening ranges ---------- */
let vProf="nit",vPos="BTN";
function paintVillains(){
  if(!OPENERS().includes(vPos))vPos="BTN";
  $("vp-intro").innerHTML=`<div class="verdict">${t().popTitle}</div><p>${t().popText}</p><ul class="poplist">${t().popFacts.map(f=>`<li>${f}</li>`).join("")}</ul><p class="muted">${t().popSrc}</p>`;
  $("vp-prof").innerHTML=PROFILES.map(k=>`<button class="pill" aria-pressed="${k===vProf}" data-vprof="${k}">${t().prof[k]}</button>`).join("");
  const sz=LIMPERS[vProf]?`${t().limpsLbl} ${bb(PSIZE[vProf])}`:bb(PSIZE[vProf]);
  $("vp-card").innerHTML=`<div class="verdict">${t().prof[vProf]}</div><div class="facts"><span>${t().statsLbl}: ${PSTATS[vProf]}</span><span>${t().sizeLbl}: ${sz}</span>${t().pfacts[vProf].map(f=>`<span>${f}</span>`).join("")}</div><p>${t().pdesc[vProf]}</p><p><b>${t().exploitLbl}</b> ${t().pexp[vProf]}</p><p class="src">${t().srcLbl} ${PSRC[vProf].map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${n}</a>`).join(" · ")}</p>`;
  $("vp-pos").hidden=!!LIMPERS[vProf];
  $("vp-pos").innerHTML=OPENERS().map(p=>`<button class="pill" aria-pressed="${p===vPos}" data-vpos="${p}">${lbl(p)}</button>`).join("");
  if(LIMPERS[vProf]){const L=LIMPERS[vProf];$("vp-grid").innerHTML=grid3({tb:L.raise,call:L.limp},"");$("vp-pct").textContent=t().vpLimper(pct(L.raise),pct(L.limp));return}
  const set=openRange(vProf,vPos);
  $("vp-grid").innerHTML=gridHTML(set,"");
  $("vp-pct").textContent=t().vpPct(t().pos[vPos],pct(set),pct(rangeFor(vPos)));
}
$("vp-prof").addEventListener("click",e=>{const b=e.target.closest("[data-vprof]");if(b){vProf=b.dataset.vprof;paintVillains()}});
$("vp-pos").addEventListener("click",e=>{const b=e.target.closest("[data-vpos]");if(b){vPos=b.dataset.vpos;paintVillains()}});

/* ---------- Equity: heads-up all-in, everyone else folded ---------- */
const BUCKETS=["0–20 %","20–40 %","40–60 %","60–80 %","80–100 %"];
let eq;
function pickSeats(k){return shuffle(ORDER().slice()).slice(0,k).sort((a,b)=>ORDER().indexOf(a)-ORDER().indexOf(b))}
function boardCenter(ctx,board,extra){return `<div class="ctx">${ctx}</div><div class="row">${cardsHTML(board,"md")}${ghosts(5-board.length,"md")}</div>${extra?`<div class="cact">${extra}</div>`:""}`}
function newEquity(){
  const stage=[0,3,3,4][rnd(4)];
  const h=deal(2),v=deal(2,h),board=deal(stage,h.concat(v));
  const ord=ORDER(),hero=ord[rnd(ord.length)];let vil;do vil=ord[rnd(ord.length)];while(vil===hero);
  const res=equity(h,v,board);
  eq={size,hero,vil,h,v,board,res,correct:Math.min(4,Math.floor(res.eq*5)),chosen:null};paintEquity();
}
function paintEquity(){
  const st=eq.board.length,stName=t().stages[st===0?0:st===3?1:2];
  const seats={};seats[eq.hero]={st:"hero"};seats[eq.vil]={st:"show",cards:eq.v,sub:t().villain};
  paintRing("eq-table",{bottom:eq.hero,bottomCards:eq.h,bottomLabel:`${t().you} · ${lbl(eq.hero)}`,seats,
    center:boardCenter(`${stName} · ${t().allin}`,eq.board)});
  paintAnswers($("eq-ans"),BUCKETS,eq);
  paintFb($("eq-fb"),eq,()=>{const r=eq.res,f=x=>(x*100).toFixed(1);
    const cur=st?`<p class="muted">${t().eqNow(handName(evalH(eq.h.concat(eq.board))),handName(evalH(eq.v.concat(eq.board))))}</p>`:"";
    return `<p>${t().eqFb(f(r.eq),f(r.win),f(r.tie))}</p>${cur}<p class="muted">${r.exact?t().exact(r.n):t().mc(r.n)}</p>`});
}
$("eq-ans").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer("equity",eq,+b.dataset.i,paintEquity)});

/* ---------- Pot odds ---------- */
const OUTS=[9,8,4,15,6,12,5];
const SIZES=[1/3,1/2,2/3,3/4,1,1.5,2];
let po;
function newPotOdds(){
  const pot=(4+rnd(37))*5,si=rnd(SIZES.length),bet=Math.max(5,Math.round(pot*SIZES[si]/5)*5);
  const need=bet/(pot+2*bet);
  if(Math.random()<.5){
    const opts=new Set([Math.round(need*100)]);const cands=[bet/(pot+bet),bet/pot,bet/(2*(pot+bet)),need+.08,need-.07,need+.15];
    for(const c of cands){if(opts.size>=4)break;const v=Math.round(c*100);if(v>2&&v<98&&![...opts].some(o=>Math.abs(o-v)<3))opts.add(v)}
    const list=shuffle([...opts]);po={type:"req",pot,bet,si,need,list,correct:list.indexOf(Math.round(need*100)),chosen:null};
  }else{
    let d,eqv;for(let k=0;k<20;k++){d=rnd(OUTS.length);eqv=OUTS[d]/46;if(Math.abs(eqv-need)>.025)break}
    po={type:"call",pot,bet,si,need,d,eqv,correct:eqv>=need?0:1,chosen:null};
  }
  paintPotOdds();
}
function paintPotOdds(){
  const sz=t().sizes[po.si],money=`<div class="seats"><div class="seat"><small>${t().pot}</small><span class="chip"><i></i>${po.pot} $</span></div><div class="seat"><small>${t().bet}</small><span class="chip"><i></i>${po.bet} $</span></div></div>`;
  if(po.type==="req"){
    $("po-table").innerHTML=`<div class="ctx">${t().poCtxReq(sz)}</div>${money}`;
    $("po-q").textContent=t().poQReq;
    paintAnswers($("po-ans"),po.list.map(v=>v+" %"),po);
  }else{
    $("po-table").innerHTML=`<div class="ctx">${t().poCtxCall(sz)}</div><div class="big">${t().draws[po.d]}</div><div class="chip mono">${t().outs(OUTS[po.d])}</div>${money}`;
    $("po-q").textContent=t().poQCall;
    paintAnswers($("po-ans"),[t().call,t().fold],po);
  }
  paintFb($("po-fb"),po,()=>{const fin=po.pot+2*po.bet;
    let txt=`<p>${t().poFb(po.bet,fin,po.bet,(po.need*100).toFixed(1),((po.pot+po.bet)/po.bet).toFixed(1))}</p>`;
    if(po.type==="call")txt+=`<p>${t().poDraw(OUTS[po.d],(po.eqv*100).toFixed(1),OUTS[po.d]*2,po.eqv>=po.need)}</p>`;
    else txt+=`<p class="muted">${t().poFormula}</p>`;return txt});
}
$("po-ans").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer("potodds",po,+b.dataset.i,paintPotOdds)});

/* ---------- Showdown: three players reach the river, the rest folded ---------- */
let sd;
function newShowdown(){
  const all=deal(11),board=all.slice(0,5),hands=[all.slice(5,7),all.slice(7,9),all.slice(9,11)].map(h=>h.sort((a,b)=>b-a));
  const scores=hands.map(h=>evalH(h.concat(board))),max=Math.max(...scores),win=scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
  sd={size,players:pickSeats(3),board,hands,scores,win,correct:win.length>1?3:win[0],chosen:null};paintShowdown();
}
function paintShowdown(){
  const done=sd.chosen!=null,seats={};
  sd.players.forEach((p,i)=>{seats[p]={st:"show",cards:sd.hands[i],sub:done?handName(sd.scores[i]):t().shown,win:done&&sd.win.includes(i)}});
  const b=sd.players[0];
  paintRing("sd-table",{bottom:b,bottomCards:sd.hands[0],bottomLabel:lbl(b),bottomSub:done?handName(sd.scores[0]):"",seats,
    center:boardCenter(t().showdownCtx,sd.board)});
  paintAnswers($("sd-ans"),sd.players.map(lbl).concat([t().split]),sd);
  paintFb($("sd-fb"),sd,()=>sd.players.map((p,k)=>`<p>${lbl(p)}${lang==="fr"?" :":":"} <b>${handName(sd.scores[k])}</b>${sd.win.includes(k)?t().wins:""}</p>`).join("")+(sd.win.length>1?`<p class="muted">${t().splitNote}</p>`:""));
}
$("sd-ans").addEventListener("click",e=>{const b=e.target.closest(".ans");if(b)answer("showdown",sd,+b.dataset.i,paintShowdown)});

/* ---------- Stats ---------- */
let resetArmed=false;
function paintStats(){
  let tot=[0,0];
  const rows=Object.keys(t().mods).map(k=>{const [ok,n]=S.m[k];tot[0]+=ok;tot[1]+=n;const p=n?Math.round(ok/n*100):0;
    return `<div class="srow"><h3>${t().mods[k]}</h3><div class="val">${n?p+" %":"—"}</div><div class="meter"><span style="width:${p}%"></span></div><div class="sub">${t().sub(ok,n)}</div></div>`}).join("");
  const tp=tot[1]?Math.round(tot[0]/tot[1]*100):0;
  $("stats").innerHTML=`<div class="srow"><h3>${t().overall}</h3><div class="val">${tot[1]?tp+" %":"—"}</div><div class="meter"><span style="width:${tp}%"></span></div><div class="sub">${t().subAll(tot[1],S.best)}</div></div>${rows}<button class="reset" id="reset">${resetArmed?t().confirmReset:t().reset}</button>${tot[1]?"":`<p class="note">${t().empty}</p>`}`;
  $("reset").onclick=()=>{if(!resetArmed){resetArmed=true;paintStats();return}
    resetArmed=false;S=blank();save();paintStreak();paintStats()};
}

/* ---------- language ---------- */
const PAINT={preflop:()=>pf&&paintPreflop(),defense:()=>df&&paintDefense(),equity:()=>eq&&paintEquity(),potodds:()=>po&&paintPotOdds(),showdown:()=>sd&&paintShowdown()};
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>{const v=t()[el.dataset.t];el.textContent=typeof v==="function"?v(size):v});
  $("set-lang").value=lang;$("set-terms").checked=keepTerms&&lang!=="en";$("set-terms").disabled=lang==="en";
  $("set-terms-row").classList.toggle("off",lang==="en");$("set-terms-hint").textContent=lang==="en"?t().setTermsOff:t().setTermsHint;
  $("open-settings").setAttribute("aria-label",t().settings);$("open-settings").title=t().settings;
  for(const k in PAINT)PAINT[k]();
  paintStudy();paintDStudy();paintDProf();if(current==="stats")paintStats();if(current==="villains")paintVillains();
}
$("set-lang").addEventListener("change",e=>{if(!T[e.target.value])return;lang=e.target.value;try{localStorage.setItem(LKEY,lang)}catch(err){}applyLang()});
$("set-terms").addEventListener("change",e=>{keepTerms=e.target.checked;try{localStorage.setItem(TKEY,keepTerms?"1":"0")}catch(err){}applyLang()});
function openSettings(){$("settings").hidden=false;$("set-lang").focus()}
function closeSettings(){$("settings").hidden=true;$("open-settings").focus()}
$("open-settings").addEventListener("click",openSettings);
$("close-settings").addEventListener("click",closeSettings);
$("settings").addEventListener("click",e=>{if(e.target.id==="settings")closeSettings()});
/* Table size: deal fresh hands in every table module that is already open, since the seats change. */
function paintSize(){document.querySelectorAll("[data-size]").forEach(b=>b.setAttribute("aria-pressed",+b.dataset.size===size))}
$("size").addEventListener("click",e=>{const b=e.target.closest("[data-size]");if(!b||+b.dataset.size===size)return;
  size=+b.dataset.size;try{localStorage.setItem(SKEY,size)}catch(err){}
  if(!OPENERS().includes(studyPos))studyPos="CO";
  paintSize();for(const k of ["preflop","defense","equity","showdown"])if(started[k])INIT[k]();applyLang()});

/* ---------- navigation ---------- */
const VIEWS=["preflop","defense","equity","potodds","showdown","villains","stats"];
const INIT={preflop:newPreflop,defense:newDefense,equity:newEquity,potodds:newPotOdds,showdown:newShowdown};
const STATE={preflop:()=>pf,defense:()=>df,equity:()=>eq,potodds:()=>po,showdown:()=>sd};
const ANS={preflop:i=>answer("preflop",pf,i,paintPreflop),defense:i=>answer("defense",df,i,paintDefense),equity:i=>answer("equity",eq,i,paintEquity),potodds:i=>answer("potodds",po,i,paintPotOdds),showdown:i=>answer("showdown",sd,i,paintShowdown)};
let current="preflop";const started={};
function show(v){
  if(v==="equite")v="equity";
  if(!VIEWS.includes(v))v="preflop";current=v;resetArmed=false;
  for(const x of VIEWS)$("v-"+x).hidden=x!==v;
  document.querySelectorAll(".tab").forEach(tb=>tb.setAttribute("aria-selected",tb.dataset.view===v));
  if(INIT[v]&&!started[v]){started[v]=true;INIT[v]()}
  if(v==="stats")paintStats();
  if(v==="villains")paintVillains();
}
document.querySelector(".tabs").addEventListener("click",e=>{const tb=e.target.closest(".tab");if(!tb)return;
  if(location.hash!=="#"+tb.dataset.view)location.hash=tb.dataset.view;else show(tb.dataset.view)});
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
document.addEventListener("click",e=>{if(e.target.closest("[data-next]")&&INIT[current]){INIT[current]();window.scrollTo({top:0,behavior:"smooth"})}});
document.addEventListener("keydown",e=>{
  if(!$("settings").hidden){if(e.key==="Escape")closeSettings();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.target.tagName==="SELECT")return;const k=e.key.toLowerCase();
  if(!INIT[current])return;const st=STATE[current]();if(!st)return;
  if((k==="enter"||k===" ")&&st.chosen!=null){e.preventDefault();INIT[current]();return}
  if(current==="preflop"){if(k==="f")ANS.preflop(0);if(k==="r")ANS.preflop(1);return}
  if(current==="defense"){const ks=dfLabels().keys.map(x=>x.toLowerCase());let m=ks.indexOf(k);if(m<0&&k==="r")m=ks.indexOf("3");if(m<0){const d=parseInt(k,10);if(d>=1&&d<=ks.length)m=d-1}if(m>=0)ANS.defense(m);return}
  const n=parseInt(k,10);const max=$(({equity:"eq",potodds:"po",showdown:"sd"})[current]+"-ans").children.length;
  if(n>=1&&n<=max)ANS[current](n-1);
});
paintStreak();paintSize();applyLang();show(location.hash.slice(1)||"preflop");
})();
</script>
